<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#03101e">
<title>RESCUE KR JET — Portrait</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020812;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;touch-action:manipulation}
#game{position:relative;width:min(100vw,520px);height:100dvh;margin:auto;overflow:hidden;background:#061321;box-shadow:0 0 70px #000}
.hero{position:absolute;inset:0;background-image:url(scene.png);background-size:auto 100%;background-position:20% center;background-repeat:no-repeat;filter:saturate(1.1) contrast(1.04);animation:camera 5s ease-in-out infinite alternate}
.shade{position:absolute;inset:0;background:linear-gradient(#02101a33 0 52%,#03101be8 68%,#020713 100%)}
.rain{position:absolute;inset:0;overflow:hidden;pointer-events:none}.rain i{position:absolute;top:-15%;width:1.5px;height:28px;background:linear-gradient(transparent,#d5f5ff99);transform:rotate(12deg);animation:rain linear infinite}
.water{position:absolute;z-index:5;left:-10%;bottom:35%;width:120%;height:17%;background:linear-gradient(#8ce8ff99,#0784bdcc 25%,#034d74dd);box-shadow:0 -7px 22px #57dfff88;transition:height .65s;animation:swell 1.2s ease-in-out infinite alternate;pointer-events:none}
.water:before{content:"";position:absolute;left:-5%;top:-13px;width:110%;height:23px;background:radial-gradient(ellipse at 50% 100%,#d5f9ff 0 30%,transparent 34%) 0 0/48px 21px repeat-x;animation:wave .8s linear infinite}
.logo{position:absolute;z-index:15;left:10px;top:8px;font-size:25px;font-weight:1000;font-style:italic;text-shadow:0 0 12px #4cdcff}.logo b{color:#ffb126}.logo small{display:block;font-size:8px;letter-spacing:.8px;color:#d4efff;font-style:normal}
.huds{position:absolute;z-index:16;right:8px;top:8px;display:flex;gap:4px}.hud{min-width:61px;padding:4px 5px;border:1px solid #42aee9;border-radius:8px;background:#061b31e8;text-align:center;font-size:8px;font-weight:850}.hud strong{display:block;font-size:13px}.timer strong{color:#ff6871}
.speech{position:absolute;z-index:13;left:10px;top:17%;width:132px;padding:7px 8px;border-radius:12px;background:#f8fcff;color:#10243a;font-size:10px;font-weight:850;box-shadow:0 5px 15px #0008;transform:rotate(-3deg)}
.gauge{position:absolute;z-index:13;left:9px;top:31%;width:37px;height:145px;padding-top:5px;border:1px solid #a9e9ff;border-radius:10px;background:#06182ac9;text-align:center;font-size:7px}.tube{position:absolute;left:13px;right:13px;top:25px;bottom:8px;border:1px solid #c3f1ff;border-radius:8px;overflow:hidden}.tube i{position:absolute;bottom:0;left:0;right:0;height:28%;background:#42d7ff;transition:.65s}
.progress{position:absolute;z-index:14;left:60px;right:12px;top:51%;padding:5px 8px;border:1px solid #3ba8db;border-radius:10px;background:#06192bd9}.pt{font-size:8px;text-align:center;color:#bfe4f3}.track{height:7px;margin-top:3px;background:#17384d;border-radius:8px;overflow:hidden}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ee897,#ffe45b);transition:.4s}
.quiz{position:absolute;z-index:20;left:9px;right:9px;bottom:9px;height:43%;padding:9px;border:1.5px solid #4bc3ff;border-radius:16px;background:linear-gradient(145deg,#092844f7,#05152af9);box-shadow:0 0 25px #168bd755;display:flex;flex-direction:column}.qhead{display:flex;justify-content:space-between;font-size:9px;font-weight:900;color:#9ee0ff}.question{min-height:56px;margin:5px 0;padding:8px 10px;border-radius:9px;background:#eef8ff;color:#10243c;font-size:13px;line-height:1.25;font-weight:950;display:flex;align-items:center}.answers{display:grid;grid-template-columns:1fr 1fr;gap:5px}.ans{min-height:39px;border:1.5px solid #a6c9e3;border-radius:8px;background:linear-gradient(#fbfdff,#c6ddec);color:#10243c;font-size:13px;font-weight:1000}.ans:active{transform:scale(.97)}.ans.good{background:#4bf06a;border-color:#b7ffc1;box-shadow:0 0 15px #2fff54}.ans.bad{background:#f75c56;color:#fff;border-color:#ffb3ae}.feedback{margin-top:5px;min-height:34px;padding:5px 7px;border:1px solid #28759d;border-radius:8px;background:#072138;font-size:9px;font-weight:850;display:flex;align-items:center}.feedback.good{color:#62ff96;border-color:#34d46d}.feedback.bad{color:#ff9289;border-color:#e2524b}
.screen{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 34%,#0c466b,#020713 73%)}.card{text-align:center;width:94%}.big{font-size:54px;line-height:.82;font-weight:1000;font-style:italic;text-shadow:0 0 22px #3dcaff}.big b{color:#ffb42c}.btn{width:100%;min-height:54px;border:1px solid #ffe29a;border-radius:13px;background:linear-gradient(#ffd452,#e9840b);font-size:18px;font-weight:1000;color:#4a2400}.hidden{display:none!important}.flash{position:absolute;z-index:30;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.on{animation:flash .14s 2}
@keyframes camera{to{transform:scale(1.025) translateX(-.5%)}}@keyframes rain{to{transform:translate(100px,120vh) rotate(12deg)}}@keyframes swell{to{transform:translateY(6px)}}@keyframes wave{to{background-position:48px 0}}@keyframes flash{50%{opacity:.25}}
@media(min-width:700px){#game{height:min(100dvh,920px);aspect-ratio:9/16}.quiz{height:39%}}
</style></head><body><main id="game"><div class="hero"></div><div class="shade"></div><div id="rain" class="rain"></div><div id="water" class="water"></div><div id="flash" class="flash"></div>
<div class="logo"><b>RESCUE</b> KR JET<small>ช่วยครูเจตหนีจากน้ำท่วม!</small></div>
<div class="huds"><div class="hud timer">เวลา<strong id="time">25</strong></div><div class="hud">คะแนน<strong id="score">0</strong></div><div class="hud">ด่าน<strong id="stage">1/10</strong></div></div>
<div id="speech" class="speech">ช่วยตอบให้ถูกครับ! น้ำกำลังสูงขึ้น!</div>
<div class="gauge">น้ำ<div class="tube"><i id="gfill"></i></div></div>
<div class="progress"><div class="pt">ความคืบหน้าการช่วยครูเจต</div><div class="track"><i id="prog"></i></div></div>
<section class="quiz"><div class="qhead"><span id="qno">คำถามที่ 1</span><span>กฎของโอห์ม</span></div><div id="q" class="question"></div><div id="answers" class="answers"></div><div id="feed" class="feedback">เลือกคำตอบก่อนเวลาหมด</div></section>
<section id="menu" class="screen"><div class="card"><div class="big"><b>RESCUE</b><br>KR JET</div><p>ตอบโจทย์ง่าย ๆ ให้ทันเวลา<br>ตอบถูกน้ำลด • ตอบผิดน้ำสูงขึ้น</p><button id="start" class="btn">เริ่มเกม</button></div></section>
<section id="end" class="screen hidden"><div class="card"><div class="big"><b>SAFE!</b><br>ช่วยสำเร็จ</div><p id="summary"></p><button id="again" class="btn">เล่นอีกครั้ง</button></div></section>
<script>
const Q=[
["12 V ÷ 6 Ω = ?",["1 A","2 A","3 A","6 A"],1],["10 V ÷ 5 Ω = ?",["1 A","2 A","5 A","10 A"],1],
["I=2 A, R=5 Ω → V=?",["5 V","7 V","10 V","12 V"],2],["V=20 V, I=4 A → R=?",["4 Ω","5 Ω","8 Ω","10 Ω"],1],
["9 V ÷ 3 Ω = ?",["2 A","3 A","6 A","9 A"],1],["I=3 A, R=4 Ω → V=?",["7 V","12 V","16 V","24 V"],1],
["24 V ÷ 8 Ω = ?",["2 A","3 A","4 A","8 A"],1],["18 V ÷ 3 A → R=?",["3 Ω","6 Ω","9 Ω","18 Ω"],1],
["I=2 A, R=6 Ω → V=?",["3 V","8 V","12 V","18 V"],2],["30 V ÷ 10 Ω = ?",["2 A","3 A","10 A","30 A"],1]];
const $=s=>document.querySelector(s);let n=0,score=0,correct=0,water=28,t=25,timer,lock=false;
for(let i=0;i<32;i++){let e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.animationDuration=(.6+Math.random()*.8)+'s';e.style.animationDelay=(-Math.random()*2)+'s';$('#rain').appendChild(e)}
function setWater(v){water=Math.max(15,Math.min(70,v));$('#water').style.height=water+'%';$('#gfill').style.height=water+'%'}
function render(){if(n>=Q.length)return finish();lock=false;t=25;$('#time').textContent=t;$('#stage').textContent=(n+1)+'/10';$('#qno').textContent='คำถามที่ '+(n+1);$('#q').textContent=Q[n][0];let a=$('#answers');a.innerHTML='';Q[n][1].forEach((v,i)=>{let b=document.createElement('button');b.className='ans';b.textContent=['ก. ','ข. ','ค. ','ง. '][i]+v;b.onclick=()=>answer(i,b);a.appendChild(b)});$('#feed').className='feedback';$('#feed').textContent='เลือกคำตอบก่อนเวลาหมด'}
function answer(i,b){if(lock)return;lock=true;if(i===Q[n][2]){b.classList.add('good');correct++;score+=100+t*2;setWater(water-6);$('#feed').className='feedback good';$('#feed').textContent='✓ ถูกต้อง! น้ำลดลง';$('#speech').textContent='เก่งมากครับ! อีกนิดเดียว!'}else{b.classList.add('bad');setWater(water+8);$('#feed').className='feedback bad';$('#feed').textContent='ผิด — คำตอบ '+Q[n][1][Q[n][2]];$('#speech').textContent='น้ำสูงขึ้นแล้ว! ช่วยข้อต่อไปด้วยครับ!';$('#flash').classList.add('on');setTimeout(()=>$('#flash').classList.remove('on'),350)}$('#score').textContent=score;$('#prog').style.width=correct*10+'%';setTimeout(()=>{n++;render()},900)}
function tick(){if(!$('#menu').classList.contains('hidden')||!$('#end').classList.contains('hidden')||lock)return;t--;$('#time').textContent=t;if(t<=0){lock=true;setWater(water+8);$('#feed').className='feedback bad';$('#feed').textContent='หมดเวลา! น้ำสูงขึ้น';setTimeout(()=>{n++;render()},850)}}
function start(){n=score=correct=0;setWater(28);$('#score').textContent=0;$('#prog').style.width='0%';$('#menu').classList.add('hidden');$('#end').classList.add('hidden');render();clearInterval(timer);timer=setInterval(tick,1000)}
function finish(){clearInterval(timer);setWater(15);$('#summary').textContent=`ตอบถูก ${correct}/10 ข้อ · ${score} คะแนน`;$('#end').classList.remove('hidden')}
$('#start').onclick=start;$('#again').onclick=start;
</script></main></body></html>
