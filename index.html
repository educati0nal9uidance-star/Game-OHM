<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Ohm's Law Mini Game — ครูเจต</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#07172b;color:#10233d}
button{font:inherit}.app{min-height:100dvh;background:linear-gradient(#edf7ff,#dcecff)}
.hero{position:relative;min-height:100dvh;background:url(home-bg.png) center/cover no-repeat}
.hero:after{content:"";position:absolute;inset:0;background:#04152b10;pointer-events:none}
.hot{position:absolute;z-index:5;border:0;background:transparent;cursor:pointer}
.playHot{left:45%;top:58%;width:21%;height:8%}.lessonHot{left:45%;top:67%;width:21%;height:7%}.scoreHot{left:45%;top:76%;width:21%;height:7%}
.mobilebar{display:none}
.panel{position:fixed;z-index:30;inset:0;background:linear-gradient(#eaf6ff,#dceeff);overflow:auto;padding:18px}.hidden{display:none}
.top{max-width:760px;margin:auto;display:flex;justify-content:space-between;align-items:center}.back{border:0;border-radius:12px;background:#183b63;color:#fff;padding:10px 16px;font-weight:900}.brand{font-size:22px;font-weight:1000;color:#1265bb}
.card{max-width:760px;margin:16px auto;background:#fff;border:1px solid #b8d8ef;border-radius:22px;padding:18px;box-shadow:0 10px 30px #316a9630}
.stats{display:flex;gap:8px}.stat{flex:1;text-align:center;background:#eaf6ff;border-radius:12px;padding:8px;font-size:12px}.stat b{display:block;font-size:20px;color:#116dc4}
.formula{text-align:center;font-size:36px;font-weight:1000;color:#176ec6;margin:8px}.formula i{color:#ef592f;font-style:normal}
.q{font-size:20px;font-weight:950;margin:18px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ans{min-height:58px;border:2px solid #a8cde8;border-radius:14px;background:#f6fbff;font-weight:900;color:#17324d}.ans:active{transform:scale(.98)}.ans.good{background:#52dc76;border-color:#22a94a}.ans.bad{background:#ef6964;color:#fff;border-color:#cf3f39}
.message{margin-top:14px;padding:12px;border-radius:12px;background:#edf7ff;font-weight:800}.bar{height:10px;background:#d8e7f2;border-radius:10px;overflow:hidden}.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,#32ca75,#ffc93e);transition:.4s}
.lesson h2{color:#176ec6}.lesson .formula{font-size:48px}.lesson p{line-height:1.7}.scorelist{font-size:18px;line-height:2}
@media(max-width:700px){
.hero{background-position:38% center;background-size:auto 100%;min-height:100dvh}
.hot{display:none}.mobilebar{display:flex;position:absolute;z-index:10;left:12px;right:12px;bottom:18px;gap:8px}
.mobilebar button{flex:1;min-height:52px;border:0;border-radius:14px;color:#fff;font-weight:1000;box-shadow:0 7px 18px #0004}
.mobilebar .p{background:#1685ef}.mobilebar .l{background:#26aa62}.mobilebar .s{background:#efa913;color:#4a3100}
.panel{padding:12px}.answers{grid-template-columns:1fr}.q{font-size:18px}.card{padding:14px}
}
</style></head><body><main class="app">
<section id="home" class="hero">
<button class="hot playHot" onclick="openGame()" aria-label="เริ่มเล่นเกม"></button>
<button class="hot lessonHot" onclick="show('lesson')" aria-label="ดูตัวอย่างโจทย์"></button>
<button class="hot scoreHot" onclick="show('scores')" aria-label="ตารางคะแนน"></button>
<div class="mobilebar"><button class="p" onclick="openGame()">▶ เริ่มเกม</button><button class="l" onclick="show('lesson')">📖 เรียนรู้</button><button class="s" onclick="show('scores')">🏆 คะแนน</button></div>
</section>

<section id="game" class="panel hidden"><div class="top"><button class="back" onclick="home()">← กลับ</button><div class="brand">Ohm's Law Mini Game</div></div>
<div class="card"><div class="stats"><div class="stat">ข้อ<b id="stage">1/10</b></div><div class="stat">เวลา<b id="time">20</b></div><div class="stat">คะแนน<b id="score">0</b></div></div>
<div class="formula"><i>V</i> = I × R</div><div class="bar"><i id="progress"></i></div><div id="q" class="q"></div><div id="answers" class="answers"></div><div id="msg" class="message">ครูเจต: ลองคิดจากสูตร V = I × R นะครับ</div></div></section>

<section id="lesson" class="panel lesson hidden"><div class="top"><button class="back" onclick="home()">← กลับ</button><div class="brand">เรียนรู้กฎของโอห์ม</div></div><div class="card"><h2>กฎของโอห์ม</h2><div class="formula"><i>V</i> = I × R</div><p><b>V</b> = แรงดันไฟฟ้า หน่วยโวลต์ (V)<br><b>I</b> = กระแสไฟฟ้า หน่วยแอมแปร์ (A)<br><b>R</b> = ความต้านทาน หน่วยโอห์ม (Ω)</p><p><b>ตัวอย่าง:</b> ถ้า I = 2 A และ R = 5 Ω จะได้ V = 2 × 5 = <b>10 V</b></p><button class="back" onclick="openGame()">เริ่มทำโจทย์</button></div></section>

<section id="scores" class="panel hidden"><div class="top"><button class="back" onclick="home()">← กลับ</button><div class="brand">คะแนนสูงสุด</div></div><div class="card scorelist" id="scoreList"></div></section>
</main><script>
const Q=[["12 V ÷ 6 Ω = ?",["1 A","2 A","3 A","6 A"],1],["10 V ÷ 5 Ω = ?",["1 A","2 A","5 A","10 A"],1],["I = 2 A, R = 5 Ω → V = ?",["5 V","7 V","10 V","12 V"],2],["V = 20 V, I = 4 A → R = ?",["4 Ω","5 Ω","8 Ω","10 Ω"],1],["9 V ÷ 3 Ω = ?",["2 A","3 A","6 A","9 A"],1],["I = 3 A, R = 4 Ω → V = ?",["7 V","12 V","16 V","24 V"],1],["24 V ÷ 8 Ω = ?",["2 A","3 A","4 A","8 A"],1],["V = 18 V, I = 3 A → R = ?",["3 Ω","6 Ω","9 Ω","18 Ω"],1],["I = 2 A, R = 6 Ω → V = ?",["3 V","8 V","12 V","18 V"],2],["30 V ÷ 10 Ω = ?",["2 A","3 A","10 A","30 A"],1]];
let n=0,score=0,t=20,timer,lock=false; const $=s=>document.querySelector(s);
function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.add('hidden'));$('#home').classList.add('hidden');$('#'+id).classList.remove('hidden');if(id==='scores') renderScores()}
function home(){clearInterval(timer);document.querySelectorAll('.panel').forEach(x=>x.classList.add('hidden'));$('#home').classList.remove('hidden')}
function openGame(){show('game');n=0;score=0;render();clearInterval(timer);timer=setInterval(tick,1000)}
function render(){if(n>=Q.length)return finish();lock=false;t=20;$('#time').textContent=t;$('#stage').textContent=(n+1)+'/10';$('#score').textContent=score;$('#progress').style.width=(n*10)+'%';$('#q').textContent=Q[n][0];$('#msg').textContent='ครูเจต: ค่อย ๆ คิดจากสูตรนะครับ';let a=$('#answers');a.innerHTML='';Q[n][1].forEach((v,i)=>{let b=document.createElement('button');b.className='ans';b.textContent=['ก. ','ข. ','ค. ','ง. '][i]+v;b.onclick=()=>answer(i,b);a.appendChild(b)})}
function answer(i,b){if(lock)return;lock=true;if(i===Q[n][2]){b.classList.add('good');score+=100+t*2;$('#msg').textContent='ครูเจต: ถูกต้องครับ เยี่ยมมาก!'}else{b.classList.add('bad');$('#msg').textContent='ครูเจต: ยังไม่ถูกครับ คำตอบคือ '+Q[n][1][Q[n][2]]}setTimeout(()=>{n++;render()},900)}
function tick(){if($('#game').classList.contains('hidden')||lock)return;t--;$('#time').textContent=t;if(t<=0){lock=true;$('#msg').textContent='ครูเจต: หมดเวลา ข้อต่อไปลองใหม่ครับ';setTimeout(()=>{n++;render()},800)}}
function finish(){clearInterval(timer);$('#progress').style.width='100%';$('#q').textContent='จบเกม!';$('#answers').innerHTML='';$('#msg').textContent='ครูเจต: ได้ '+score+' คะแนน เก่งมากครับ';let s=JSON.parse(localStorage.getItem('ohmScores')||'[]');s.push({score,date:new Date().toLocaleDateString('th-TH')});s.sort((a,b)=>b.score-a.score);localStorage.setItem('ohmScores',JSON.stringify(s.slice(0,5)))}
function renderScores(){let s=JSON.parse(localStorage.getItem('ohmScores')||'[]');$('#scoreList').innerHTML=s.length?s.map((x,i)=>`${i+1}. ${x.score} คะแนน — ${x.date}`).join('<br>'):'ยังไม่มีคะแนน ลองเล่นเกมก่อนครับ'}
</script></body></html>
