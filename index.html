<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow"><title>RESCUE ครูเจต V13.5 Pivot Rig</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#03101e;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}
#game{position:relative;width:min(100vw,500px);height:100dvh;margin:auto;overflow:hidden;background:radial-gradient(circle at 50% 18%,#155a78,#08263a 55%,#020b15)}
.logo{position:absolute;z-index:30;left:10px;top:8px;font-size:24px;font-weight:1000;font-style:italic}.logo b{color:#ffb326}.logo small{display:block;font-size:8px;font-style:normal}
.huds{position:absolute;z-index:30;right:7px;top:7px;display:flex;gap:4px}.hud{min-width:55px;padding:4px;border:1px solid #45c9ff;border-radius:9px;background:#041a2ddd;text-align:center;font-size:8px;font-weight:900}.hud strong{display:block;font-size:14px}.timer strong{color:#ff6068}

/* Character skeleton */
#rig{position:absolute;z-index:8;left:9%;top:11%;width:72%;height:48%;animation:float 1.5s ease-in-out infinite}
#body{position:absolute;z-index:5;left:26%;top:34%;width:50%;filter:drop-shadow(0 7px 8px #0005)}
.headPivot{position:absolute;z-index:10;left:31%;top:1%;width:45%;height:39%;transform-origin:50% 92%;animation:headBob 1.8s ease-in-out infinite}
.faceClip{position:absolute;inset:0;border-radius:47% 47% 45% 45%/43% 43% 56% 56%;overflow:hidden;background:#c99572;box-shadow:0 4px 8px #0004}
#head{position:absolute;width:146%;height:146%;left:-23%;top:-17%;object-fit:cover;object-position:50% 34%}
.neck{position:absolute;z-index:4;left:46%;top:29%;width:14%;height:19%;border-radius:16px;background:linear-gradient(#d2a079,#bd865f)}
.shoulderCap{position:absolute;z-index:4;top:39%;width:18%;height:18%;border-radius:50%;background:#bd8b58}.shoulderCap.l{left:19%}.shoulderCap.r{right:18%}

/* True nested pivot chain: shoulder > upper arm > elbow > forearm > wrist > hand */
.armRig{position:absolute;z-index:3;top:38%;width:34%;height:58%;pointer-events:none}
.armRig.left{left:5%}.armRig.right{right:3%;transform:scaleX(-1)}
.shoulderPivot{position:absolute;left:50%;top:5%;width:54px;height:98px;transform-origin:50% 10px;animation:shoulder 1.2s ease-in-out infinite}
.upperArm{position:absolute;left:11px;top:0;width:32px;height:92px;border-radius:18px 18px 16px 16px;background:linear-gradient(90deg,#b98451,#d0a06d 48%,#b77e4b);border:1px solid #8b603c}
.elbowPivot{position:absolute;left:16px;top:78px;width:44px;height:100px;transform-origin:11px 11px;animation:elbow 1.05s ease-in-out infinite}
.elbowBall{position:absolute;left:0;top:0;width:23px;height:23px;border-radius:50%;background:#d2a17a}
.forearm{position:absolute;left:2px;top:10px;width:28px;height:91px;border-radius:15px;background:linear-gradient(90deg,#c78e67,#dda984 48%,#c78e67);transform:rotate(-2deg)}
.wristPivot{position:absolute;left:2px;top:87px;width:55px;height:67px;transform-origin:14px 9px;animation:wrist .85s ease-in-out infinite}
.wrist{position:absolute;left:4px;top:0;width:23px;height:22px;border-radius:12px;background:#d8a47e}
.hand{position:absolute;left:-4px;top:13px;width:44px;height:48px;border-radius:50% 50% 44% 44%;background:linear-gradient(90deg,#ca926d,#e0ab85,#ca916c)}
.finger{position:absolute;width:9px;height:34px;border-radius:9px;background:#dda681;transform-origin:50% 3px}.f1{left:1px;top:31px;transform:rotate(32deg)}.f2{left:11px;top:38px;transform:rotate(12deg)}.f3{left:21px;top:38px;transform:rotate(-3deg)}.f4{left:31px;top:32px;transform:rotate(-20deg)}
#game.correct .shoulderPivot{animation:shoulderGood .32s 2 alternate}
#game.correct .elbowPivot{animation:elbowGood .32s 2 alternate}
#game.wrong .elbowPivot{animation:elbowWrong .16s 5 alternate}
#game.wrong .wristPivot{animation:wristWrong .16s 5 alternate}
#game.correct #rig{animation:good .5s ease}#game.wrong #rig{animation:bad .12s 7}

.speech{position:absolute;z-index:20;right:3%;top:27%;width:130px;padding:8px;border-radius:14px;background:#fff;color:#11283d;font-size:10px;font-weight:900;box-shadow:0 6px 18px #0007}
.water{position:absolute;z-index:14;left:-10%;bottom:36%;width:120%;height:18%;background:linear-gradient(#b9f7ffad,#159ed5e8 18%,#034c73);box-shadow:0 -10px 28px #5ce5ff99;transition:height .7s;animation:swell .8s ease-in-out infinite alternate}.wave,.wave2{position:absolute;left:-5%;width:110%;height:28px;background:radial-gradient(ellipse at 50% 100%,#e8fdff 0 28%,transparent 32%) 0 0/48px 25px repeat-x}.wave{top:-18px;animation:wave .62s linear infinite}.wave2{top:-7px;opacity:.4;background-size:37px 20px;animation:wave2 .52s linear infinite}
.rain{position:absolute;z-index:18;inset:0;pointer-events:none}.rain i{position:absolute;top:-15%;width:1.5px;height:31px;background:linear-gradient(transparent,#d9f7ffb8);animation:rain linear infinite;transform:rotate(12deg)}
.progress{position:absolute;z-index:22;left:9px;right:9px;top:56%;padding:5px 8px;border:1px solid #42c7ff;border-radius:10px;background:#04192ddd}.track{height:8px;background:#17384d;border-radius:8px;overflow:hidden}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#30d77c,#ffd243);transition:.4s}
.quiz{position:absolute;z-index:25;left:8px;right:8px;bottom:8px;height:39%;padding:9px;border:1.5px solid #48c8ff;border-radius:16px;background:#04192df5;box-shadow:0 0 25px #168bd655}.qhead{display:flex;justify-content:space-between;font-size:9px;font-weight:900;color:#a4e6ff}.question{min-height:48px;margin:6px 0;padding:8px 10px;border-radius:9px;background:#f2faff;color:#10243b;font-size:14px;font-weight:950;display:flex;align-items:center}.answers{display:grid;grid-template-columns:1fr 1fr;gap:6px}.ans{min-height:38px;border:1.5px solid #acd3ec;border-radius:9px;background:linear-gradient(#fff,#cce4f2);color:#10243b;font-size:12px;font-weight:1000}.ans.good{background:#4ce978}.ans.bad{background:#ef625c;color:#fff}.feedback{margin-top:6px;min-height:30px;padding:6px 8px;border:1px solid #277aa4;border-radius:9px;background:#06243c;font-size:9px;font-weight:900}.feedback.good{color:#61ff95}.feedback.bad{color:#ff938a}
.screen{position:absolute;z-index:60;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 32%,#0d5277,#020713 75%)}.card{text-align:center;width:94%}.big{font-size:51px;line-height:.84;font-weight:1000;font-style:italic}.big b{color:#ffb42c}.btn{width:100%;min-height:54px;border:1px solid #ffe49a;border-radius:13px;background:linear-gradient(#ffd65a,#e8860c);color:#4b2500;font-size:18px;font-weight:1000}.hidden{display:none!important}

@keyframes float{50%{transform:translateY(-8px) rotate(.5deg)}}@keyframes headBob{50%{transform:rotate(-4deg) translateY(-2px)}}
@keyframes shoulder{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-26deg)}}@keyframes elbow{0%,100%{transform:rotate(8deg)}50%{transform:rotate(38deg)}}@keyframes wrist{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
@keyframes shoulderGood{to{transform:rotate(-55deg)}}@keyframes elbowGood{to{transform:rotate(58deg)}}@keyframes elbowWrong{to{transform:rotate(-10deg)}}@keyframes wristWrong{to{transform:rotate(20deg)}}
@keyframes good{50%{transform:translateY(-15px) scale(1.03)}}@keyframes bad{50%{transform:translateX(7px) rotate(2deg)}}@keyframes swell{to{transform:translateY(7px)}}@keyframes wave{to{background-position:48px 0}}@keyframes wave2{to{background-position:-37px 0}}@keyframes rain{to{transform:translate(100px,120vh) rotate(12deg)}}
</style></head><body><main id="game">
<div class="logo"><b>RESCUE</b> ครูเจต<small>เกมกฎของโอห์ม</small></div>
<div class="huds"><div class="hud timer">เวลา<strong id="time">20</strong></div><div class="hud">คะแนน<strong id="score">0</strong></div><div class="hud">ด่าน<strong id="stage">1/10</strong></div></div>

<div id="rig">
 <div class="neck"></div><div class="shoulderCap l"></div><div class="shoulderCap r"></div>
 <div class="armRig left"><div class="shoulderPivot"><div class="upperArm"></div><div class="elbowPivot"><div class="elbowBall"></div><div class="forearm"></div><div class="wristPivot"><div class="wrist"></div><div class="hand"></div><i class="finger f1"></i><i class="finger f2"></i><i class="finger f3"></i><i class="finger f4"></i></div></div></div></div>
 <div class="armRig right"><div class="shoulderPivot"><div class="upperArm"></div><div class="elbowPivot"><div class="elbowBall"></div><div class="forearm"></div><div class="wristPivot"><div class="wrist"></div><div class="hand"></div><i class="finger f1"></i><i class="finger f2"></i><i class="finger f3"></i><i class="finger f4"></i></div></div></div></div>
 <img id="body" src="body.png">
 <div class="headPivot"><div class="faceClip"><img id="head" src="head.png"></div></div>
</div>

<div id="speech" class="speech">ช่วยครูเจตด้วยครับ!</div><div id="rain" class="rain"></div><div id="water" class="water"><div class="wave"></div><div class="wave2"></div></div>
<div class="progress"><div class="track"><i id="prog"></i></div></div>
<section class="quiz"><div class="qhead"><span id="qno">คำถามที่ 1</span><span>⚡ กฎของโอห์ม</span></div><div id="q" class="question"></div><div id="answers" class="answers"></div><div id="feed" class="feedback">เลือกคำตอบก่อนเวลาหมด</div></section>
<section id="menu" class="screen"><div class="card"><div class="big"><b>RESCUE</b><br>ครูเจต</div><p>V13.5 — Pivot Rig<br>หัวไหล่ → ศอก → ข้อมือ → มือ</p><button id="start" class="btn">เริ่มภารกิจ</button></div></section>
<section id="end" class="screen hidden"><div class="card"><div class="big"><b>SAFE!</b><br>สำเร็จ</div><p id="summary"></p><button id="again" class="btn">เล่นอีกครั้ง</button></div></section>
<script>
const Q=[["12 V ÷ 6 Ω = ?",["1 A","2 A","3 A","6 A"],1],["10 V ÷ 5 Ω = ?",["1 A","2 A","5 A","10 A"],1],["I=2 A, R=5 Ω → V=?",["5 V","7 V","10 V","12 V"],2],["V=20 V, I=4 A → R=?",["4 Ω","5 Ω","8 Ω","10 Ω"],1],["9 V ÷ 3 Ω = ?",["2 A","3 A","6 A","9 A"],1],["I=3 A, R=4 Ω → V=?",["7 V","12 V","16 V","24 V"],1],["24 V ÷ 8 Ω = ?",["2 A","3 A","4 A","8 A"],1],["18 V ÷ 3 A → R=?",["3 Ω","6 Ω","9 Ω","18 Ω"],1],["I=2 A, R=6 Ω → V=?",["3 V","8 V","12 V","18 V"],2],["30 V ÷ 10 Ω = ?",["2 A","3 A","10 A","30 A"],1]];
const $=s=>document.querySelector(s),g=$('#game'),head=$('#head');let n=0,score=0,correct=0,water=18,t=20,timer,lock=false;
for(let i=0;i<36;i++){let e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.animationDuration=(.55+Math.random()*.8)+'s';e.style.animationDelay=(-Math.random()*2)+'s';$('#rain').appendChild(e)}
function face(name){head.src=name+'.png'}function setWater(v){water=Math.max(11,Math.min(60,v));$('#water').style.height=water+'%'}
function state(s){g.classList.remove('wrong','correct');void g.offsetWidth;g.classList.add(s);setTimeout(()=>g.classList.remove(s),900)}
function render(){if(n>=10)return finish();lock=false;t=20;face(n>6?'face_serious':'head');$('#time').textContent=t;$('#stage').textContent=(n+1)+'/10';$('#qno').textContent='คำถามที่ '+(n+1);$('#q').textContent=Q[n][0];let a=$('#answers');a.innerHTML='';Q[n][1].forEach((v,i)=>{let b=document.createElement('button');b.className='ans';b.textContent=['ก. ','ข. ','ค. ','ง. '][i]+v;b.onclick=()=>answer(i,b);a.appendChild(b)});$('#feed').className='feedback';$('#feed').textContent='เลือกคำตอบก่อนเวลาหมด'}
function answer(i,b){if(lock)return;lock=true;if(i===Q[n][2]){b.classList.add('good');correct++;score+=100+t*2;face('face_happy');setWater(water-6);state('correct');$('#speech').textContent='เก่งมากครับ! น้ำลดแล้ว!';$('#feed').className='feedback good';$('#feed').textContent='✓ ถูกต้อง'}else{b.classList.add('bad');face('face_serious');setWater(water+9);state('wrong');$('#speech').textContent='ไม่เป็นไร ลองใหม่ข้อต่อไปครับ!';$('#feed').className='feedback bad';$('#feed').textContent='ผิด — คำตอบ '+Q[n][1][Q[n][2]]}$('#score').textContent=score;$('#prog').style.width=correct*10+'%';setTimeout(()=>{n++;render()},1050)}
function tick(){if(!$('#menu').classList.contains('hidden')||!$('#end').classList.contains('hidden')||lock)return;t--;$('#time').textContent=t;if(t<=0){lock=true;face('face_talk');setWater(water+9);state('wrong');$('#feed').className='feedback bad';$('#feed').textContent='หมดเวลา!';setTimeout(()=>{n++;render()},950)}}
function start(){n=score=correct=0;setWater(18);face('head');$('#score').textContent=0;$('#prog').style.width=0;$('#menu').classList.add('hidden');$('#end').classList.add('hidden');render();clearInterval(timer);timer=setInterval(tick,1000)}
function finish(){clearInterval(timer);face(correct>=6?'face_happy':'face_serious');setWater(11);$('#summary').textContent=`ตอบถูก ${correct}/10 ข้อ · ${score} คะแนน`;$('#end').classList.remove('hidden')}
$('#start').onclick=start;$('#again').onclick=start;
</script></main></body></html>
