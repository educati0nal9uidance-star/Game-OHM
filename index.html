<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow"><title>RESCUE ครูเจต V11</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020813;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;color:white}
#game{position:relative;width:min(100vw,500px);height:100dvh;margin:auto;overflow:hidden;background:radial-gradient(circle at 50% 25%,#164f70,#071827 55%,#020914);isolation:isolate}
.scene{position:absolute;inset:0;background:linear-gradient(90deg,transparent 49%,#ffffff0a 50%,transparent 51%);background-size:92px 100%}
.logo{position:absolute;z-index:40;left:9px;top:8px;font-weight:1000;font-style:italic;font-size:24px;text-shadow:0 0 14px #43d8ff}.logo b{color:#ffb42b}.logo small{display:block;font-size:8px;font-style:normal}
.huds{position:absolute;z-index:40;right:7px;top:7px;display:flex;gap:4px}.hud{min-width:54px;padding:4px;border:1px solid #47bff4;border-radius:8px;background:#061b31e8;text-align:center;font-size:8px;font-weight:900}.hud strong{display:block;font-size:13px}.timer strong{color:#ff6670}

/* Human-proportioned articulated character */
#person{position:absolute;z-index:9;left:5%;top:10%;width:72%;height:50%;animation:float 1.35s ease-in-out infinite;transform-origin:50% 80%}
.torso{position:absolute;z-index:3;left:27%;top:36%;width:47%;height:53%;border-radius:30% 30% 18% 18%/16% 16% 10% 10%;background:linear-gradient(90deg,#b98d58,#d2aa75 48%,#b98b57);border:2px solid #745431;box-shadow:inset 0 8px 12px #fff2,0 7px 13px #0004}
.shirtline{position:absolute;left:49%;top:2%;width:3px;height:94%;background:#8d683f80}
.belt{position:absolute;left:3%;right:3%;bottom:12%;height:10%;background:#55422b;border-radius:5px}.buckle{position:absolute;left:44%;top:-4px;width:28px;height:23px;border-radius:4px;background:#d8ad43;border:3px solid #735b27}
.pocket{position:absolute;left:12%;top:45%;width:26%;height:20%;border:2px solid #85623d;border-radius:4px}.ribbons{position:absolute;right:11%;top:42%;width:27%;height:12%;background:repeating-linear-gradient(90deg,#d94843 0 8px,#f0cf4d 8px 15px,#3e7fc1 15px 22px)}
.collar{position:absolute;z-index:8;left:22%;top:-1%;width:56%;height:25%}.collar:before,.collar:after{content:"";position:absolute;top:0;width:51%;height:100%;background:#d3a974;border:2px solid #765534}.collar:before{left:0;clip-path:polygon(0 0,100% 15%,68% 100%,0 57%)}.collar:after{right:0;clip-path:polygon(100% 0,0 15%,32% 100%,100% 57%)}
.neck{position:absolute;z-index:4;left:43%;top:27%;width:18%;height:18%;border-radius:20px;background:linear-gradient(#d5a17d,#c58d69);box-shadow:inset 0 -5px 8px #9e694c33}
.arm{position:absolute;z-index:2;top:39%;width:19%;height:46%;transform-origin:50% 8%}
.upper,.fore{position:absolute;left:27%;width:46%;height:55%;border-radius:40px;background:linear-gradient(90deg,#b98c57,#d0a46f,#b78a56);border:2px solid #745431}
.upper{top:0}.fore{top:45%;transform-origin:50% 8%}.hand{position:absolute;left:14%;bottom:-9%;width:72%;aspect-ratio:.82;border-radius:48% 48% 43% 43%;background:linear-gradient(90deg,#c58f6b,#dfa983,#c98f6a);border:2px solid #805642}
.arm.left{left:13%;animation:leftArm .9s ease-in-out infinite}.arm.left .fore{transform:rotate(8deg)}.arm.right{right:10%;animation:rightArm 1.05s ease-in-out infinite}.arm.right .fore{transform:rotate(-10deg)}
#head{position:absolute;z-index:12;left:28%;top:1%;width:48%;height:40%;transform-origin:50% 85%;animation:head 1.65s ease-in-out infinite}
.faceMask{position:absolute;left:50%;top:0;transform:translateX(-50%);width:100%;height:100%;overflow:hidden;border-radius:47% 47% 45% 45%/42% 42% 56% 56%;background:#d7a27e;-webkit-mask-image:radial-gradient(ellipse 53% 59% at 50% 47%,#000 72%,#000e 82%,transparent 98%);mask-image:radial-gradient(ellipse 53% 59% at 50% 47%,#000 72%,#000e 82%,transparent 98%)}
#face{position:absolute;width:145%;height:145%;left:-22.5%;top:-17%;object-fit:cover;object-position:50% 33%;filter:saturate(.94) contrast(1.02)}
.hairBlend{position:absolute;z-index:14;left:9%;right:9%;top:2%;height:25%;border-radius:60% 60% 32% 32%;background:linear-gradient(#15151a,#222127 70%,transparent);opacity:.35;pointer-events:none}
#game.correct #person{animation:happy .52s ease}#game.wrong #person{animation:shake .12s 7}
.speech{position:absolute;z-index:25;right:4%;top:27%;width:125px;padding:7px;border-radius:12px;background:#f7fbff;color:#12263b;font-size:10px;font-weight:900;box-shadow:0 5px 18px #0008}
.water{position:absolute;z-index:16;left:-10%;bottom:36%;width:120%;height:18%;background:linear-gradient(#b9f6ffa5,#129dd4e8 18%,#034d75);box-shadow:0 -9px 28px #55ddff99;transition:height .7s;animation:swell .85s ease-in-out infinite alternate}.wave,.wave2{position:absolute;left:-5%;width:110%;height:28px;background:radial-gradient(ellipse at 50% 100%,#e6fcff 0 28%,transparent 32%) 0 0/48px 25px repeat-x}.wave{top:-18px;animation:wave .62s linear infinite}.wave2{top:-7px;opacity:.4;background-size:37px 20px;animation:wave2 .52s linear infinite}
.rain{position:absolute;z-index:20;inset:0;pointer-events:none;overflow:hidden}.rain i{position:absolute;top:-15%;width:1.5px;height:31px;background:linear-gradient(transparent,#d9f7ffb8);animation:rain linear infinite;transform:rotate(12deg)}
.progress{position:absolute;z-index:25;left:9px;right:9px;top:56%;padding:5px 8px;border:1px solid #3daee1;border-radius:10px;background:#06192dde}.track{height:7px;background:#17384d;border-radius:8px;overflow:hidden}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#29e695,#ffe35c);transition:.4s}
.quiz{position:absolute;z-index:30;left:8px;right:8px;bottom:8px;height:39%;padding:8px;border:1.5px solid #4bc5ff;border-radius:15px;background:#061a2ef8;box-shadow:0 0 26px #168bd655}.qhead{display:flex;justify-content:space-between;font-size:9px;font-weight:900;color:#9de1ff}.question{min-height:48px;margin:5px 0;padding:7px 9px;border-radius:8px;background:#eff9ff;color:#10243b;font-size:13px;font-weight:950;display:flex;align-items:center}.answers{display:grid;grid-template-columns:1fr 1fr;gap:5px}.ans{min-height:36px;border:1.5px solid #aacce4;border-radius:8px;background:linear-gradient(#fff,#c6ddeb);color:#10243b;font-size:12px;font-weight:1000}.ans.good{background:#45ef68}.ans.bad{background:#f15a53;color:white}.feedback{margin-top:5px;min-height:29px;padding:5px 7px;border:1px solid #28769d;border-radius:8px;background:#072239;font-size:9px;font-weight:900}.feedback.good{color:#61ff95}.feedback.bad{color:#ff938a}
.screen{position:absolute;z-index:70;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 32%,#0c496f,#020713 74%)}.card{text-align:center;width:94%}.big{font-size:50px;line-height:.85;font-weight:1000;font-style:italic}.big b{color:#ffb42c}.btn{width:100%;min-height:54px;border:1px solid #ffe49a;border-radius:13px;background:linear-gradient(#ffd65a,#e8860c);font-size:18px;font-weight:1000;color:#4b2500}.hidden{display:none!important}
@keyframes float{50%{transform:translateY(-7px) rotate(.5deg)}}@keyframes head{50%{transform:rotate(-4deg) translateY(-2px)}}@keyframes leftArm{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-34deg) translate(-8px,-8px)}}@keyframes rightArm{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(22deg) translate(5px,-4px)}}@keyframes happy{50%{transform:translateY(-15px) scale(1.025)}}@keyframes shake{50%{transform:translateX(7px) rotate(1.5deg)}}@keyframes swell{to{transform:translateY(7px)}}@keyframes wave{to{background-position:48px 0}}@keyframes wave2{to{background-position:-37px 0}}@keyframes rain{to{transform:translate(100px,120vh) rotate(12deg)}}
</style></head><body><main id="game"><div class="scene"></div>
<div class="logo"><b>RESCUE</b> ครูเจต<small>เกมกฎของโอห์ม</small></div><div class="huds"><div class="hud timer">เวลา<strong id="time">20</strong></div><div class="hud">คะแนน<strong id="score">0</strong></div><div class="hud">ด่าน<strong id="stage">1/10</strong></div></div>
<div id="person"><div class="neck"></div><div class="arm left"><div class="upper"></div><div class="fore"><div class="hand"></div></div></div><div class="arm right"><div class="upper"></div><div class="fore"><div class="hand"></div></div></div><div class="torso"><div class="shirtline"></div><div class="collar"></div><div class="pocket"></div><div class="ribbons"></div><div class="belt"><div class="buckle"></div></div></div><div id="head"><div class="faceMask"><img id="face" src="face0.png"></div><div class="hairBlend"></div></div></div>
<div id="speech" class="speech">ช่วยครูเจตด้วยครับ!</div><div id="rain" class="rain"></div><div id="water" class="water"><div class="wave"></div><div class="wave2"></div></div><div class="progress"><div class="track"><i id="prog"></i></div></div>
<section class="quiz"><div class="qhead"><span id="qno">คำถามที่ 1</span><span>กฎของโอห์ม</span></div><div id="q" class="question"></div><div id="answers" class="answers"></div><div id="feed" class="feedback">เลือกคำตอบก่อนเวลาหมด</div></section>
<section id="menu" class="screen"><div class="card"><div class="big"><b>RESCUE</b><br>ครูเจต</div><p>V11 — ร่างกายสัดส่วนมนุษย์<br>หัว แขน ท่อนแขน และลำตัวเคลื่อนไหวแยกกัน</p><button id="start" class="btn">เริ่มภารกิจ</button></div></section>
<section id="end" class="screen hidden"><div class="card"><div class="big"><b>SAFE!</b><br>ช่วยสำเร็จ</div><p id="summary"></p><button id="again" class="btn">เล่นอีกครั้ง</button></div></section>
<script>
const Q=[["12 V ÷ 6 Ω = ?",["1 A","2 A","3 A","6 A"],1],["10 V ÷ 5 Ω = ?",["1 A","2 A","5 A","10 A"],1],["I=2 A, R=5 Ω → V=?",["5 V","7 V","10 V","12 V"],2],["V=20 V, I=4 A → R=?",["4 Ω","5 Ω","8 Ω","10 Ω"],1],["9 V ÷ 3 Ω = ?",["2 A","3 A","6 A","9 A"],1],["I=3 A, R=4 Ω → V=?",["7 V","12 V","16 V","24 V"],1],["24 V ÷ 8 Ω = ?",["2 A","3 A","4 A","8 A"],1],["18 V ÷ 3 A → R=?",["3 Ω","6 Ω","9 Ω","18 Ω"],1],["I=2 A, R=6 Ω → V=?",["3 V","8 V","12 V","18 V"],2],["30 V ÷ 10 Ω = ?",["2 A","3 A","10 A","30 A"],1]];
const $=s=>document.querySelector(s),g=$('#game'),face=$('#face');let n=0,score=0,correct=0,water=18,t=20,timer,lock=false;
for(let i=0;i<34;i++){let e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.animationDuration=(.55+Math.random()*.8)+'s';e.style.animationDelay=(-Math.random()*2)+'s';$('#rain').appendChild(e)}
function mood(i){face.src='face'+i+'.png'}function setWater(v){water=Math.max(11,Math.min(60,v));$('#water').style.height=water+'%'}
function state(s){g.classList.remove('wrong','correct');void g.offsetWidth;g.classList.add(s);setTimeout(()=>g.classList.remove(s),900)}
function render(){if(n>=10)return finish();lock=false;t=20;mood(n>6?3:0);$('#time').textContent=t;$('#stage').textContent=(n+1)+'/10';$('#qno').textContent='คำถามที่ '+(n+1);$('#q').textContent=Q[n][0];let a=$('#answers');a.innerHTML='';Q[n][1].forEach((v,i)=>{let b=document.createElement('button');b.className='ans';b.textContent=['ก. ','ข. ','ค. ','ง. '][i]+v;b.onclick=()=>answer(i,b);a.appendChild(b)});$('#feed').className='feedback';$('#feed').textContent='เลือกคำตอบก่อนเวลาหมด'}
function answer(i,b){if(lock)return;lock=true;if(i===Q[n][2]){b.classList.add('good');correct++;score+=100+t*2;mood(correct>6?2:1);setWater(water-6);state('correct');$('#speech').textContent='เยี่ยมครับ! น้ำลดแล้ว!';$('#feed').className='feedback good';$('#feed').textContent='✓ ถูกต้อง'}else{b.classList.add('bad');mood(water>36?4:3);setWater(water+9);state('wrong');$('#speech').textContent='โอ๊ะ! น้ำสูงขึ้นแล้ว!';$('#feed').className='feedback bad';$('#feed').textContent='ผิด — คำตอบ '+Q[n][1][Q[n][2]]}$('#score').textContent=score;$('#prog').style.width=correct*10+'%';setTimeout(()=>{n++;render()},1050)}
function tick(){if(!$('#menu').classList.contains('hidden')||!$('#end').classList.contains('hidden')||lock)return;t--;$('#time').textContent=t;if(t<=0){lock=true;mood(4);setWater(water+9);state('wrong');$('#feed').className='feedback bad';$('#feed').textContent='หมดเวลา!';setTimeout(()=>{n++;render()},950)}}
function start(){n=score=correct=0;setWater(18);mood(0);$('#score').textContent=0;$('#prog').style.width=0;$('#menu').classList.add('hidden');$('#end').classList.add('hidden');render();clearInterval(timer);timer=setInterval(tick,1000)}
function finish(){clearInterval(timer);mood(correct>=6?2:5);setWater(11);$('#summary').textContent=`ตอบถูก ${correct}/10 ข้อ · ${score} คะแนน`;$('#end').classList.remove('hidden')}
$('#start').onclick=start;$('#again').onclick=start;
</script></main></body></html>
