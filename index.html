<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow"><title>RESCUE KR JET V7</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020713;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;color:#fff;touch-action:manipulation}
#game{position:relative;width:min(100vw,520px);height:100dvh;margin:auto;overflow:hidden;background:#061526;isolation:isolate}
.bg{position:absolute;inset:-3%;background:url(krjet-game.png) 50% 35%/cover no-repeat;transform:scale(1.02);animation:camera 6s ease-in-out infinite alternate}
.dark{position:absolute;inset:0;background:linear-gradient(#0001 0 47%,#00101ac9 61%,#020713 100%)}
.lightning{position:absolute;z-index:3;inset:0;background:radial-gradient(circle at 70% 13%,#e7fbff99,transparent 12%);opacity:.1;animation:lightning 4.5s infinite}
.rain{position:absolute;z-index:4;inset:0;overflow:hidden;pointer-events:none}.rain i{position:absolute;top:-20%;width:2px;height:35px;background:linear-gradient(transparent,#d9f7ffbb);transform:rotate(12deg);animation:rain linear infinite}
.actor{position:absolute;z-index:5;left:3%;top:13%;width:94%;height:43%;transform-origin:50% 75%;animation:actor 1.45s ease-in-out infinite;pointer-events:none}
.headMove{position:absolute;left:44%;top:12%;width:28%;height:28%;border-radius:50%;background:#ffffff08;transform-origin:50% 80%;animation:head 1.8s ease-in-out infinite}
.reach{position:absolute;left:8%;top:39%;width:46%;height:12%;border-radius:50%;background:linear-gradient(90deg,#fff0,#dffaff12,#fff0);transform-origin:85% 50%;animation:reach 1.05s ease-in-out infinite}
#game.correct .actor{animation:good .55s ease}#game.wrong .actor{animation:wrong .12s 7}
#game.wrong .mood{opacity:1}.mood{position:absolute;z-index:9;left:43%;top:22%;width:31%;height:17%;border-radius:50%;background:radial-gradient(circle at 50% 75%,#4d00004f,#ff4b3b17 58%,transparent 70%);opacity:0;transition:.18s;pointer-events:none}
.water{position:absolute;z-index:10;left:-12%;bottom:37%;width:124%;height:18%;background:linear-gradient(#b3f2ff8f,#129bd0d9 18%,#034d73f2);box-shadow:0 -10px 30px #5de3ff99;transition:height .75s cubic-bezier(.2,.8,.2,1);animation:swell .9s ease-in-out infinite alternate;pointer-events:none}
.wave,.wave2{position:absolute;left:-5%;width:110%;height:28px;background:radial-gradient(ellipse at 50% 100%,#e4fcff 0 28%,transparent 32%) 0 0/50px 25px repeat-x}.wave{top:-18px;animation:wave .65s linear infinite}.wave2{top:-8px;opacity:.45;background-size:37px 20px;animation:wave2 .55s linear infinite}
.foam{position:absolute;inset:0;background-image:radial-gradient(circle,#fff 0 2px,transparent 3px),radial-gradient(circle,#a8efff 0 3px,transparent 4px);background-size:47px 71px,91px 117px;opacity:.58;animation:bubble 2.4s linear infinite}
.splash{position:absolute;z-index:12;width:7px;height:7px;border-radius:50%;background:#e8fcff;box-shadow:0 0 8px #8ce8ff;animation:splash .7s ease-out forwards;pointer-events:none}
.logo{position:absolute;z-index:20;left:8px;top:7px;font-size:24px;font-weight:1000;font-style:italic;text-shadow:0 0 12px #4ed8ff}.logo b{color:#ffb328}.logo small{display:block;font-size:8px;font-style:normal;letter-spacing:.7px}
.huds{position:absolute;z-index:20;right:7px;top:7px;display:flex;gap:4px}.hud{min-width:57px;padding:4px;border:1px solid #46baf0;border-radius:8px;background:#061b31e8;text-align:center;font-size:8px;font-weight:900}.hud strong{display:block;font-size:13px}.timer strong{color:#ff626b}
.speech{position:absolute;z-index:18;left:8px;top:19%;width:130px;padding:7px;border-radius:12px;background:#f8fcff;color:#12253a;font-size:10px;font-weight:900;box-shadow:0 5px 18px #0008;transform:rotate(-3deg)}
.progress{position:absolute;z-index:18;left:9px;right:9px;top:56%;padding:5px 8px;border:1px solid #3daee1;border-radius:10px;background:#06192dde}.track{height:7px;background:#17384d;border-radius:8px;overflow:hidden}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#29e695,#ffe35c);transition:.4s}
.quiz{position:absolute;z-index:25;left:8px;right:8px;bottom:8px;height:39%;padding:8px;border:1.5px solid #4bc5ff;border-radius:15px;background:#061a2ef8;box-shadow:0 0 26px #168bd655}.qhead{display:flex;justify-content:space-between;font-size:9px;font-weight:900;color:#9de1ff}.question{min-height:48px;margin:5px 0;padding:7px 9px;border-radius:8px;background:#eff9ff;color:#10243b;font-size:13px;font-weight:950;display:flex;align-items:center}.answers{display:grid;grid-template-columns:1fr 1fr;gap:5px}.ans{min-height:36px;border:1.5px solid #aacce4;border-radius:8px;background:linear-gradient(#fff,#c6ddeb);color:#10243b;font-size:12px;font-weight:1000}.ans:active{transform:scale(.97)}.ans.good{background:#45ef68;box-shadow:0 0 16px #34ff58}.ans.bad{background:#f15a53;color:#fff;box-shadow:0 0 16px #ff4c43}.feedback{margin-top:5px;min-height:29px;padding:5px 7px;border:1px solid #28769d;border-radius:8px;background:#072239;font-size:9px;font-weight:900}.feedback.good{color:#61ff95}.feedback.bad{color:#ff938a}
.flash{position:absolute;z-index:40;inset:0;background:#ff4437;opacity:0;pointer-events:none}.flash.on{animation:flash .14s 2}
.screen{position:absolute;z-index:60;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 32%,#0c496f,#020713 74%)}.card{text-align:center;width:94%}.big{font-size:53px;line-height:.82;font-weight:1000;font-style:italic;text-shadow:0 0 23px #42d0ff}.big b{color:#ffb42c}.btn{width:100%;min-height:54px;border:1px solid #ffe49a;border-radius:13px;background:linear-gradient(#ffd65a,#e8860c);color:#4b2500;font-size:18px;font-weight:1000}.hidden{display:none!important}
@keyframes camera{to{transform:scale(1.055) translate(-.4%,.3%)}}@keyframes actor{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-8px) rotate(.7deg)}}@keyframes head{50%{transform:rotate(-5deg) translateY(-2px)}}@keyframes reach{0%,100%{transform:rotate(-6deg) translateX(0)}50%{transform:rotate(7deg) translate(8px,-6px) scaleX(1.05)}}@keyframes good{50%{transform:translateY(-14px) scale(1.025)}}@keyframes wrong{50%{transform:translateX(7px) rotate(1.8deg)}}@keyframes swell{to{transform:translateY(7px)}}@keyframes wave{to{background-position:50px 0}}@keyframes wave2{to{background-position:-37px 0}}@keyframes bubble{to{background-position:0 -155px,0 -225px}}@keyframes rain{to{transform:translate(105px,120vh) rotate(12deg)}}@keyframes lightning{4%,7%{opacity:.55}5%,8%,100%{opacity:.1}}@keyframes splash{to{transform:translate(var(--x),var(--y)) scale(.1);opacity:0}}@keyframes flash{50%{opacity:.2}}
</style></head><body><main id="game"><div class="bg"></div><div class="dark"></div><div class="lightning"></div><div id="rain" class="rain"></div><div class="actor"><div class="headMove"></div><div class="reach"></div></div><div class="mood"></div><div id="water" class="water"><div class="wave"></div><div class="wave2"></div><div class="foam"></div></div><div id="flash" class="flash"></div>
<div class="logo"><b>RESCUE</b> KR JET<small>OHM'S LAW RESCUE</small></div><div class="huds"><div class="hud timer">เวลา<strong id="time">20</strong></div><div class="hud">คะแนน<strong id="score">0</strong></div><div class="hud">ด่าน<strong id="stage">1/10</strong></div></div>
<div id="speech" class="speech">ช่วยตอบให้ถูกครับ! น้ำกำลังสูงขึ้น!</div><div class="progress"><div class="track"><i id="prog"></i></div></div>
<section class="quiz"><div class="qhead"><span id="qno">คำถามที่ 1</span><span>กฎของโอห์ม</span></div><div id="q" class="question"></div><div id="answers" class="answers"></div><div id="feed" class="feedback">เลือกคำตอบก่อนเวลาหมด</div></section>
<section id="menu" class="screen"><div class="card"><div class="big"><b>RESCUE</b><br>KR JET</div><p>ตัวละคร + น้ำ + ฝน + กล้อง เคลื่อนไหวตลอดเกม</p><button id="start" class="btn">เริ่มภารกิจ</button></div></section>
<section id="end" class="screen hidden"><div class="card"><div class="big"><b>SAFE!</b><br>สำเร็จ</div><p id="summary"></p><button id="again" class="btn">เล่นอีกครั้ง</button></div></section>
<script>
const Q=[["12 V ÷ 6 Ω = ?",["1 A","2 A","3 A","6 A"],1],["10 V ÷ 5 Ω = ?",["1 A","2 A","5 A","10 A"],1],["I=2 A, R=5 Ω → V=?",["5 V","7 V","10 V","12 V"],2],["V=20 V, I=4 A → R=?",["4 Ω","5 Ω","8 Ω","10 Ω"],1],["9 V ÷ 3 Ω = ?",["2 A","3 A","6 A","9 A"],1],["I=3 A, R=4 Ω → V=?",["7 V","12 V","16 V","24 V"],1],["24 V ÷ 8 Ω = ?",["2 A","3 A","4 A","8 A"],1],["18 V ÷ 3 A → R=?",["3 Ω","6 Ω","9 Ω","18 Ω"],1],["I=2 A, R=6 Ω → V=?",["3 V","8 V","12 V","18 V"],2],["30 V ÷ 10 Ω = ?",["2 A","3 A","10 A","30 A"],1]];
const $=s=>document.querySelector(s),g=$('#game');let n=0,score=0,correct=0,water=18,t=20,timer,lock=false;
for(let i=0;i<40;i++){let e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.animationDuration=(.55+Math.random()*.8)+'s';e.style.animationDelay=(-Math.random()*2)+'s';$('#rain').appendChild(e)}
function setWater(v){water=Math.max(11,Math.min(60,v));$('#water').style.height=water+'%'}
function state(s){g.classList.remove('wrong','correct');void g.offsetWidth;g.classList.add(s);setTimeout(()=>g.classList.remove(s),850)}
function splash(c=20){for(let i=0;i<c;i++){let e=document.createElement('i');e.className='splash';e.style.left=(12+Math.random()*68)+'%';e.style.top=(38+Math.random()*17)+'%';e.style.setProperty('--x',((Math.random()-.5)*120)+'px');e.style.setProperty('--y',(-30-Math.random()*90)+'px');g.appendChild(e);setTimeout(()=>e.remove(),750)}}
function render(){if(n>=10)return finish();lock=false;t=20;$('#time').textContent=t;$('#stage').textContent=(n+1)+'/10';$('#qno').textContent='คำถามที่ '+(n+1);$('#q').textContent=Q[n][0];let a=$('#answers');a.innerHTML='';Q[n][1].forEach((v,i)=>{let b=document.createElement('button');b.className='ans';b.textContent=['ก. ','ข. ','ค. ','ง. '][i]+v;b.onclick=()=>answer(i,b);a.appendChild(b)});$('#feed').className='feedback';$('#feed').textContent='เลือกคำตอบก่อนเวลาหมด'}
function answer(i,b){if(lock)return;lock=true;if(i===Q[n][2]){b.classList.add('good');correct++;score+=100+t*2;setWater(water-6);state('correct');splash(12);$('#speech').textContent='เก่งมากครับ! น้ำลดแล้ว!';$('#feed').className='feedback good';$('#feed').textContent='✓ ถูกต้อง! น้ำลดลง'}else{b.classList.add('bad');setWater(water+9);state('wrong');splash(34);$('#flash').classList.add('on');setTimeout(()=>$('#flash').classList.remove('on'),350);$('#speech').textContent='โอ๊ะ! น้ำสูงขึ้นแล้ว ข้อต่อไปเอาใหม่!';$('#feed').className='feedback bad';$('#feed').textContent='ผิด — คำตอบ '+Q[n][1][Q[n][2]]}$('#score').textContent=score;$('#prog').style.width=correct*10+'%';setTimeout(()=>{n++;render()},1000)}
function tick(){if(!$('#menu').classList.contains('hidden')||!$('#end').classList.contains('hidden')||lock)return;t--;$('#time').textContent=t;if(t<=0){lock=true;setWater(water+9);state('wrong');splash(30);$('#feed').className='feedback bad';$('#feed').textContent='หมดเวลา! น้ำสูงขึ้น';setTimeout(()=>{n++;render()},900)}}
function start(){n=score=correct=0;setWater(18);$('#score').textContent=0;$('#prog').style.width=0;$('#menu').classList.add('hidden');$('#end').classList.add('hidden');render();clearInterval(timer);timer=setInterval(tick,1000)}
function finish(){clearInterval(timer);setWater(11);$('#summary').textContent=`ตอบถูก ${correct}/10 ข้อ · ${score} คะแนน`;$('#end').classList.remove('hidden')}
$('#start').onclick=start;$('#again').onclick=start;
</script></main></body></html>
