<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#020914">
<title>RESCUE KR JET V5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#01060c;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;touch-action:manipulation}
#game{position:relative;width:min(100vw,520px);height:100dvh;margin:auto;overflow:hidden;background:#061421;isolation:isolate}
.bg{position:absolute;inset:-3%;background:url(scene.png) 19% center/auto 105% no-repeat;animation:camera 7s ease-in-out infinite alternate;filter:saturate(1.08) contrast(1.05)}
.light{position:absolute;inset:0;background:radial-gradient(circle at 29% 24%,#ff322e30,transparent 20%),radial-gradient(circle at 55% 25%,#45d9ff28,transparent 25%);mix-blend-mode:screen;animation:alarm .7s infinite alternate}
.rain{position:absolute;inset:0;overflow:hidden}.rain i{position:absolute;top:-15%;height:34px;width:1.5px;background:linear-gradient(transparent,#dff9ffbb);transform:rotate(12deg);animation:rain linear infinite}
.characterMotion{position:absolute;z-index:5;left:0;top:0;width:58%;height:59%;transform-origin:45% 70%;pointer-events:none;animation:body 1.8s ease-in-out infinite}
.armL,.armR{position:absolute;border-radius:999px;background:linear-gradient(90deg,#ffffff00,#dff8ff16,#ffffff00);filter:drop-shadow(0 0 8px #8be7ff66);transform-origin:90% 50%}
.armL{left:7%;top:30%;width:42%;height:10%;animation:reach 1.15s ease-in-out infinite}
.armR{left:30%;top:44%;width:35%;height:8%;animation:reach2 1.35s ease-in-out infinite}
.faceFX{position:absolute;z-index:6;left:21%;top:29%;width:23%;height:15%;border-radius:50%;background:radial-gradient(circle,#fff0 45%,#5edbff13);animation:breathe 1.5s infinite alternate}
#game.wrong .characterMotion{animation:panic .16s 5}
#game.wrong .faceFX{background:radial-gradient(circle at 50% 70%,#5a000055,#ff3b2d22 55%,transparent 70%);filter:saturate(.5) brightness(.8)}
#game.correct .characterMotion{animation:relief .5s ease}
.waterBack{position:absolute;z-index:3;left:-10%;bottom:35%;width:120%;height:20%;background:#0a75a977;filter:blur(2px);transition:height .8s}
.water{position:absolute;z-index:8;left:-12%;bottom:34%;width:124%;height:22%;background:linear-gradient(#a7efff88,#1497cbbb 20%,#034d72e8 72%);box-shadow:0 -8px 28px #55ddff99;transition:height .8s cubic-bezier(.2,.8,.2,1);animation:swell 1s ease-in-out infinite alternate;pointer-events:none}
.wave1,.wave2{position:absolute;left:-5%;width:110%;height:31px;background:radial-gradient(ellipse at 50% 100%,#dffbff 0 27%,transparent 31%) 0 0/55px 28px repeat-x}
.wave1{top:-20px;animation:wave .75s linear infinite}.wave2{top:-10px;background-size:39px 21px;opacity:.5;animation:wave2 .62s linear infinite}
.foam{position:absolute;inset:0;background-image:radial-gradient(circle,#efffff 0 2px,transparent 3px),radial-gradient(circle,#9cecff 0 3px,transparent 4px);background-size:51px 73px,91px 121px;animation:bubbles 2.7s linear infinite;opacity:.6}
.splash{position:absolute;z-index:12;width:7px;height:7px;border-radius:50%;background:#d9faff;box-shadow:0 0 8px #79ddff;pointer-events:none;animation:splash .75s ease-out forwards}
.logo{position:absolute;z-index:20;left:9px;top:7px;font-size:24px;font-weight:1000;font-style:italic;text-shadow:0 0 13px #4cdcff}.logo b{color:#ffb027}.logo small{display:block;font-size:8px;letter-spacing:.7px;font-style:normal}
.huds{position:absolute;z-index:20;right:7px;top:7px;display:flex;gap:4px}.hud{min-width:58px;padding:4px;border:1px solid #3eb7f1;border-radius:8px;background:#061b30e8;text-align:center;font-size:8px;font-weight:900}.hud strong{display:block;font-size:13px}.timer strong{color:#ff5f68;text-shadow:0 0 8px #ff3544}
.speech{position:absolute;z-index:18;left:8px;top:17%;width:132px;padding:7px 8px;border-radius:12px;background:#f7fcff;color:#11243a;font-size:10px;font-weight:900;box-shadow:0 5px 18px #0008;transform:rotate(-3deg);transition:.2s}
.gauge{position:absolute;z-index:18;left:8px;top:32%;width:36px;height:132px;border:1px solid #b5edff;border-radius:10px;background:#061729d5;font-size:7px;text-align:center;padding-top:5px}.tube{position:absolute;left:13px;right:13px;top:25px;bottom:8px;border:1px solid #c9f4ff;border-radius:8px;overflow:hidden}.tube i{position:absolute;left:0;right:0;bottom:0;height:22%;background:#48dfff;transition:.8s}
.progress{position:absolute;z-index:18;left:57px;right:10px;top:51%;padding:5px 7px;border:1px solid #35a8df;border-radius:10px;background:#06192cdc}.pt{text-align:center;font-size:8px;color:#c1e5f4}.track{height:7px;margin-top:3px;background:#17374d;border-radius:8px;overflow:hidden}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#27e694,#ffe15b);transition:.45s}
.quiz{position:absolute;z-index:25;left:8px;right:8px;bottom:8px;height:42%;padding:9px;border:1.5px solid #4dc5ff;border-radius:16px;background:linear-gradient(145deg,#092944f8,#05152afc);box-shadow:0 0 28px #1599e05c;display:flex;flex-direction:column}.qhead{display:flex;justify-content:space-between;font-size:9px;font-weight:900;color:#9ce0ff}.question{min-height:55px;margin:5px 0;padding:8px 9px;border-radius:9px;background:#eff8ff;color:#10243b;font-size:13px;font-weight:950;display:flex;align-items:center}.answers{display:grid;grid-template-columns:1fr 1fr;gap:5px}.ans{min-height:39px;border:1.5px solid #a8cbe5;border-radius:8px;background:linear-gradient(#fbfdff,#c4dced);color:#10243b;font-size:13px;font-weight:1000;transition:.12s}.ans:active{transform:scale(.97)}.ans.good{background:#46ef69;border-color:#c4ffcb;box-shadow:0 0 18px #34ff59}.ans.bad{background:#f65b54;border-color:#ffb8b2;color:#fff;box-shadow:0 0 18px #ff4b42}.feedback{margin-top:5px;min-height:33px;padding:5px 7px;border:1px solid #28779f;border-radius:8px;background:#072238;font-size:9px;font-weight:900;display:flex;align-items:center}.feedback.good{color:#61ff96}.feedback.bad{color:#ff9188}
.flash{position:absolute;z-index:40;inset:0;background:#ff4d3d;opacity:0;pointer-events:none}.flash.on{animation:flash .15s 2}
.screen{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 33%,#0d496f,#020713 74%)}.card{text-align:center;width:94%}.big{font-size:54px;line-height:.82;font-weight:1000;font-style:italic;text-shadow:0 0 24px #3bcaff}.big b{color:#ffb42d}.btn{width:100%;min-height:55px;border:1px solid #ffe69f;border-radius:13px;background:linear-gradient(#ffd65a,#e8840b);color:#4b2400;font-size:18px;font-weight:1000}.hidden{display:none!important}
@keyframes camera{to{transform:scale(1.025) translate(-.4%,.2%)}}@keyframes alarm{to{filter:brightness(1.35)}}@keyframes body{0%,100%{transform:rotate(-.6deg) translateY(0)}50%{transform:rotate(.8deg) translateY(-5px)}}@keyframes breathe{to{transform:scale(1.04)}}@keyframes reach{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg) translate(4px,-5px)}}@keyframes reach2{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-8deg) translate(-3px,-3px)}}@keyframes panic{50%{transform:translateX(7px) rotate(2deg)}}@keyframes relief{50%{transform:translateY(-10px) scale(1.02)}}@keyframes swell{to{transform:translateY(7px)}}@keyframes wave{to{background-position:55px 0}}@keyframes wave2{to{background-position:-39px 0}}@keyframes bubbles{to{background-position:0 -170px,0 -240px}}@keyframes rain{to{transform:translate(100px,120vh) rotate(12deg)}}@keyframes splash{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}@keyframes flash{50%{opacity:.22}}
</style></head><body>
<main id="game"><div class="bg"></div><div class="light"></div><div id="rain" class="rain"></div>
<div class="characterMotion"><div class="armL"></div><div class="armR"></div><div class="faceFX"></div></div>
<div id="waterBack" class="waterBack"></div><div id="water" class="water"><div class="wave1"></div><div class="wave2"></div><div class="foam"></div></div><div id="flash" class="flash"></div>
<div class="logo"><b>RESCUE</b> KR JET<small>OHM'S LAW · FLOOD ESCAPE</small></div>
<div class="huds"><div class="hud timer">เวลา<strong id="time">20</strong></div><div class="hud">คะแนน<strong id="score">0</strong></div><div class="hud">ด่าน<strong id="stage">1/10</strong></div></div>
<div id="speech" class="speech">ช่วยตอบให้ถูกครับ! ระบบระบายน้ำจะทำงาน!</div><div class="gauge">ระดับน้ำ<div class="tube"><i id="gfill"></i></div></div>
<div class="progress"><div class="pt">ความคืบหน้าการช่วยครูเจต</div><div class="track"><i id="prog"></i></div></div>
<section class="quiz"><div class="qhead"><span id="qno">คำถามที่ 1</span><span>กฎของโอห์ม</span></div><div id="q" class="question"></div><div id="answers" class="answers"></div><div id="feed" class="feedback">เลือกคำตอบก่อนเวลาหมด</div></section>
<section id="menu" class="screen"><div class="card"><div class="big"><b>RESCUE</b><br>KR JET</div><p>ตอบโจทย์ง่าย ๆ ให้ทันเวลา<br>ตอบถูก → น้ำลด • ตอบผิด → น้ำสูงขึ้น</p><button id="start" class="btn">เริ่มภารกิจ</button></div></section>
<section id="end" class="screen hidden"><div class="card"><div class="big"><b>SAFE!</b><br>ช่วยสำเร็จ</div><p id="summary"></p><button id="again" class="btn">เล่นอีกครั้ง</button></div></section>
<script>
const Q=[
["12 V ÷ 6 Ω = ?",["1 A","2 A","3 A","6 A"],1],["10 V ÷ 5 Ω = ?",["1 A","2 A","5 A","10 A"],1],
["I = 2 A, R = 5 Ω → V = ?",["5 V","7 V","10 V","12 V"],2],["V = 20 V, I = 4 A → R = ?",["4 Ω","5 Ω","8 Ω","10 Ω"],1],
["9 V ÷ 3 Ω = ?",["2 A","3 A","6 A","9 A"],1],["I = 3 A, R = 4 Ω → V = ?",["7 V","12 V","16 V","24 V"],1],
["24 V ÷ 8 Ω = ?",["2 A","3 A","4 A","8 A"],1],["18 V ÷ 3 A → R = ?",["3 Ω","6 Ω","9 Ω","18 Ω"],1],
["I = 2 A, R = 6 Ω → V = ?",["3 V","8 V","12 V","18 V"],2],["30 V ÷ 10 Ω = ?",["2 A","3 A","10 A","30 A"],1]];
const $=s=>document.querySelector(s),game=$('#game');let n=0,score=0,correct=0,water=22,t=20,timer,lock=false;
for(let i=0;i<38;i++){let e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.animationDuration=(.55+Math.random()*.8)+'s';e.style.animationDelay=(-Math.random()*2)+'s';$('#rain').appendChild(e)}
function setWater(v){water=Math.max(13,Math.min(65,v));$('#water').style.height=water+'%';$('#waterBack').style.height=(water+3)+'%';$('#gfill').style.height=water+'%'}
function splashes(count=22){for(let i=0;i<count;i++){let s=document.createElement('i');s.className='splash';s.style.left=(18+Math.random()*45)+'%';s.style.top=(40+Math.random()*15)+'%';s.style.setProperty('--dx',((Math.random()-.5)*110)+'px');s.style.setProperty('--dy',(-25-Math.random()*90)+'px');game.appendChild(s);setTimeout(()=>s.remove(),800)}}
function state(cls){game.classList.remove('wrong','correct');void game.offsetWidth;game.classList.add(cls);setTimeout(()=>game.classList.remove(cls),850)}
function render(){if(n>=Q.length)return finish();lock=false;t=20;$('#time').textContent=t;$('#stage').textContent=(n+1)+'/10';$('#qno').textContent='คำถามที่ '+(n+1);$('#q').textContent=Q[n][0];let a=$('#answers');a.innerHTML='';Q[n][1].forEach((v,i)=>{let b=document.createElement('button');b.className='ans';b.textContent=['ก. ','ข. ','ค. ','ง. '][i]+v;b.onclick=()=>answer(i,b);a.appendChild(b)});$('#feed').className='feedback';$('#feed').textContent='เลือกคำตอบก่อนเวลาหมด'}
function answer(i,b){if(lock)return;lock=true;if(i===Q[n][2]){b.classList.add('good');correct++;score+=100+t*2;setWater(water-6);state('correct');splashes(12);$('#feed').className='feedback good';$('#feed').textContent='✓ ถูกต้อง! ระบบระบายน้ำทำงาน';$('#speech').textContent='ดีมากครับ! น้ำลดแล้ว ไปต่อเลย!'}else{b.classList.add('bad');setWater(water+9);state('wrong');splashes(34);$('#flash').classList.add('on');setTimeout(()=>$('#flash').classList.remove('on'),350);$('#feed').className='feedback bad';$('#feed').textContent='ผิด — คำตอบคือ '+Q[n][1][Q[n][2]];$('#speech').textContent='แย่แล้ว! น้ำสูงขึ้น ข้อต่อไปช่วยให้ทันนะครับ!'}$('#score').textContent=score;$('#prog').style.width=correct*10+'%';setTimeout(()=>{n++;render()},1050)}
function tick(){if(!$('#menu').classList.contains('hidden')||!$('#end').classList.contains('hidden')||lock)return;t--;$('#time').textContent=t;if(t<=0){lock=true;setWater(water+9);state('wrong');splashes(32);$('#feed').className='feedback bad';$('#feed').textContent='หมดเวลา! น้ำสูงขึ้น';$('#speech').textContent='หมดเวลาแล้ว! รีบช่วยในข้อต่อไป!';setTimeout(()=>{n++;render()},950)}}
function start(){n=score=correct=0;setWater(22);$('#score').textContent=0;$('#prog').style.width='0%';$('#menu').classList.add('hidden');$('#end').classList.add('hidden');render();clearInterval(timer);timer=setInterval(tick,1000)}
function finish(){clearInterval(timer);setWater(13);$('#summary').textContent=`ตอบถูก ${correct}/10 ข้อ · คะแนน ${score} · ระบบระบายน้ำเปิดเต็มกำลัง`;$('#end').classList.remove('hidden')}
$('#start').onclick=start;$('#again').onclick=start;
</script></main></body></html>
