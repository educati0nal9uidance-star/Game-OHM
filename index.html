<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#020714"><meta name="robots" content="noindex,nofollow">
<title>OHM BLASTER V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#01040c;color:white;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;overflow:hidden;touch-action:none}
#wrap{height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#0b315e,#020713 58%,#01030a)}
#gamebox{position:relative;width:min(100vw,540px);height:100dvh;max-height:960px;overflow:hidden;background:#020714}
canvas{width:100%;height:100%;display:block;touch-action:none}
.screen{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at 50% 32%,rgba(13,70,132,.62),rgba(2,7,20,.96) 68%)}
.hidden{display:none!important}.card{text-align:center;width:min(390px,94%)}.logo{font-weight:1000;font-style:italic;font-size:clamp(48px,14vw,78px);line-height:.8;letter-spacing:-4px;text-shadow:0 0 12px #56caff,0 0 35px #1767ff}.logo small{display:block;font-style:normal;font-size:13px;letter-spacing:5px;color:#79d8ff;margin-top:22px}.tag{margin:25px 0;color:#c8dcf4;font-weight:700;line-height:1.6}
.btn{border:1px solid #8be0ff;background:linear-gradient(180deg,#198bce,#07508d);box-shadow:0 0 25px #168fff66;color:white;border-radius:16px;min-height:58px;width:100%;font-size:20px;font-weight:1000}
#hud{position:absolute;left:0;right:0;top:0;z-index:8;padding:10px 13px;pointer-events:none}.hudrow{display:flex;justify-content:space-between;gap:8px;font-weight:900}.hp{color:#ff6673}.score{text-align:right}.mission{margin:8px auto 0;max-width:95%;width:max-content;padding:9px 15px;border-radius:12px;background:#04162de6;border:1px solid #47c7ff99;box-shadow:0 0 18px #169aff3b;text-align:center;font-weight:1000;font-size:17px}
#combo{position:absolute;right:15px;top:100px;z-index:8;font-weight:1000;color:#ffd76a;text-shadow:0 0 12px #ff9d00;pointer-events:none}
#toast{position:absolute;z-index:12;left:50%;top:43%;transform:translate(-50%,-50%) scale(.9);padding:10px 18px;border-radius:14px;background:#041226e8;border:1px solid #6ed8ff;font-weight:1000;opacity:0;transition:.13s;pointer-events:none;white-space:nowrap}
#guide{position:absolute;z-index:7;left:50%;bottom:22px;transform:translateX(-50%);padding:8px 14px;border-radius:20px;background:#061326aa;border:1px solid #3779a4;color:#b9d8ef;font-size:12px;pointer-events:none}
.result{padding:22px;border:1px solid #438bb6;border-radius:22px;background:#06162be8;box-shadow:0 0 40px #087bd84a}.stars{font-size:48px;color:#ffc64d;text-shadow:0 0 15px #ff9e00}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.stat{background:#0a213c;padding:12px;border-radius:11px}.muted{color:#91abc2;font-size:12px}
</style></head>
<body><div id="wrap"><main id="gamebox">
<canvas id="cv"></canvas>
<div id="hud" class="hidden"><div class="hudrow"><div><span id="stage">STAGE 1</span><br><span class="hp" id="hp">♥ ♥ ♥</span></div><div class="score">SCORE<br><span id="score">0</span></div></div><div id="mission" class="mission">ยิง V — แรงดันไฟฟ้า</div></div>
<div id="combo" class="hidden">COMBO ×1</div><div id="toast">PERFECT!</div><div id="guide" class="hidden">ลากยานซ้าย–ขวา • ยิงอัตโนมัติ</div>
<section id="menu" class="screen"><div class="card"><div class="logo">OHM<br>BLASTER<small>NEON CIRCUIT STRIKE</small></div><div class="tag">เกมยิงพิชิตกฎของโอห์ม<br><span class="muted">ลากยานเพื่อเล็ง • ระบบยิงให้อัตโนมัติ</span></div><button id="play" class="btn">เริ่มภารกิจ</button></div></section>
<section id="end" class="screen hidden"><div class="card result"><div class="muted">MISSION COMPLETE</div><h1>STAGE CLEAR!</h1><div class="stars">★★★</div><div class="grid"><div class="stat">คะแนน<br><b id="fs">0</b></div><div class="stat">Combo สูงสุด<br><b id="fc">0</b></div></div><button id="again" class="btn">เล่นอีกครั้ง</button></div></section>
</main></div>
<script>
const cv=document.getElementById('cv'),x=cv.getContext('2d'),box=document.getElementById('gamebox'),$=s=>document.querySelector(s);
let W,H,dpr,playing=false,ship,lasers=[],enemies=[],fx=[],bg=[],score=0,hp=3,combo=0,maxCombo=0,stage=1,kills=0,last=0,auto=0,spawn=0,shake=0,boss=null,transition=false;
const stages=[
 {m:'ยิง V — แรงดันไฟฟ้า',c:'V',p:['V','I','R'],n:8},
 {m:'ยิง A — หน่วยกระแสไฟฟ้า',c:'A',p:['V','A','Ω'],n:8},
 {m:'12 V ÷ 4 Ω = ? A',c:'3A',p:['2A','3A','6A'],n:8},
 {m:'24 V ÷ 6 A = ? Ω',c:'4Ω',p:['2Ω','4Ω','8Ω'],n:8}
];
function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',size);size();for(let i=0;i<130;i++)bg.push({x:Math.random(),y:Math.random(),z:.5+Math.random()*2.5});
function hud(){ $('#score').textContent=score.toLocaleString();$('#hp').textContent='♥ '.repeat(Math.max(0,hp));$('#stage').textContent=stage<5?'STAGE '+stage:'BOSS · OVERLOAD';$('#combo').textContent='COMBO ×'+Math.max(1,combo);$('#combo').classList.toggle('hidden',combo<2)}
function say(t){let e=$('#toast');e.textContent=t;e.style.opacity=1;e.style.transform='translate(-50%,-50%) scale(1.08)';clearTimeout(say.t);say.t=setTimeout(()=>{e.style.opacity=0;e.style.transform='translate(-50%,-50%) scale(.9)'},520)}
function reset(){playing=true;score=0;hp=3;combo=maxCombo=0;stage=1;kills=0;lasers=[];enemies=[];fx=[];boss=null;transition=false;ship={x:W/2,y:H*.84};$('#menu').classList.add('hidden');$('#end').classList.add('hidden');$('#hud').classList.remove('hidden');$('#guide').classList.remove('hidden');startStage();hud()}
function startStage(){kills=0;enemies=[];transition=false;if(stage<=4){$('#mission').textContent=stages[stage-1].m}else{$('#mission').textContent='24 V ÷ 6 Ω = ? A · ทำลาย 4A';boss={x:W/2,y:145,hp:14,max:14,dir:1}}}
function addEnemy(){if(stage>4)return;let s=stages[stage-1],lane=Math.floor(Math.random()*3),text=s.p[Math.floor(Math.random()*s.p.length)];enemies.push({x:(lane+.5)*W/3,y:-55,r:36,text,good:text===s.c,vy:.55+stage*.06,hp:2})}
function explode(px,py,col){for(let i=0;i<22;i++)fx.push({x:px,y:py,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,a:1,s:2+Math.random()*4,col})}
function correct(e){score+=100+combo*20;combo++;maxCombo=Math.max(maxCombo,combo);kills++;explode(e.x,e.y,'#64d8ff');say(combo>2?'COMBO ×'+combo+'  +'+(100+(combo-1)*20):'PERFECT +100');shake=5}
function wrong(e){hp--;combo=0;explode(e.x,e.y,'#ff5b47');say('เป้าหมายผิด');shake=9;if(hp<=0){hp=3;score=Math.max(0,score-250);say('SHIELD RESTORED')}hud()}
function advance(){if(transition)return;transition=true;stage++;if(stage>5){setTimeout(finish,650);return}say(stage===5?'⚠ BOSS OVERLOAD':'STAGE '+stage);setTimeout(startStage,700);hud()}
function finish(){playing=false;$('#hud').classList.add('hidden');$('#guide').classList.add('hidden');$('#combo').classList.add('hidden');$('#fs').textContent=score.toLocaleString();$('#fc').textContent='×'+maxCombo;$('#end').classList.remove('hidden')}
function laser(){lasers.push({x:ship.x,y:ship.y-30,vy:-12,r:7})}
function hit(a,b,extra=0){return Math.hypot(a.x-b.x,a.y-b.y)<(a.r||5)+(b.r||0)+extra}
function update(dt){
 bg.forEach(s=>{s.y+=.00012*dt*s.z;if(s.y>1){s.y=0;s.x=Math.random()}});
 if(!playing)return;
 auto+=dt;if(auto>145){laser();auto=0}
 lasers.forEach(l=>l.y+=l.vy*dt/16.67);lasers=lasers.filter(l=>l.y>-30);
 fx.forEach(p=>{p.x+=p.vx*dt/16.67;p.y+=p.vy*dt/16.67;p.a-=.035*dt/16.67});fx=fx.filter(p=>p.a>0);
 if(stage<=4){spawn+=dt;if(spawn>720&&kills<stages[stage-1].n&&enemies.length<4){addEnemy();spawn=0}
 enemies.forEach(e=>e.y+=e.vy*dt/16.67);
 for(let i=lasers.length-1;i>=0;i--){for(let j=enemies.length-1;j>=0;j--){if(hit(lasers[i],enemies[j],8)){let e=enemies[j];lasers.splice(i,1);e.hp--;if(e.hp<=0){e.good?correct(e):wrong(e);enemies.splice(j,1);hud()}break}}}
 enemies=enemies.filter(e=>e.y<H+70);if(kills>=stages[stage-1].n&&enemies.length===0)advance()
 }else if(boss){boss.x+=boss.dir*.075*dt;if(boss.x<85||boss.x>W-85)boss.dir*=-1;for(let i=lasers.length-1;i>=0;i--)if(hit(lasers[i],boss,10)){lasers.splice(i,1);boss.hp--;score+=30;explode(lasers[i]?.x||boss.x,boss.y+30,'#ff8b55');if(boss.hp<=0){score+=1500;combo++;maxCombo=Math.max(maxCombo,combo);explode(boss.x,boss.y,'#ffd04d');boss=null;say('BOSS DESTROYED +1500');setTimeout(advance,700)}hud();break}}
 if(shake>0)shake*=.85;
}
function drawShip(){x.save();x.translate(ship.x,ship.y);x.shadowBlur=28;x.shadowColor='#27aaff';let g=x.createLinearGradient(0,-35,0,28);g.addColorStop(0,'#d9f8ff');g.addColorStop(.35,'#39aaff');g.addColorStop(1,'#0b376b');x.fillStyle=g;x.beginPath();x.moveTo(0,-35);x.lineTo(14,-5);x.lineTo(31,23);x.lineTo(8,16);x.lineTo(0,24);x.lineTo(-8,16);x.lineTo(-31,23);x.lineTo(-14,-5);x.closePath();x.fill();x.fillStyle='#ff9d36';x.shadowColor='#ff6b00';x.beginPath();x.moveTo(-8,19);x.lineTo(0,46+Math.random()*10);x.lineTo(8,19);x.fill();x.restore()}
function drawEnemy(e){x.save();x.translate(e.x,e.y);let col=e.good?'#3ac9ff':'#ff5d52';x.shadowBlur=25;x.shadowColor=col;x.strokeStyle=col;x.lineWidth=3;x.fillStyle='#071326';x.beginPath();x.arc(0,0,e.r,0,Math.PI*2);x.fill();x.stroke();x.rotate(Math.PI/4);x.strokeRect(-25,-25,50,50);x.rotate(-Math.PI/4);x.fillStyle='#fff';x.font='1000 21px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(e.text,0,1);x.restore()}
function draw(){
 x.save();let sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;x.translate(sx,sy);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#02081a');g.addColorStop(.48,'#08264a');g.addColorStop(1,'#020611');x.fillStyle=g;x.fillRect(-10,-10,W+20,H+20);
 let neb=x.createRadialGradient(W*.25,H*.25,10,W*.25,H*.25,W*.7);neb.addColorStop(0,'rgba(24,98,180,.22)');neb.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=neb;x.fillRect(0,0,W,H);
 bg.forEach(s=>{x.globalAlpha=.25+s.z*.18;x.fillStyle='#b8e9ff';x.fillRect(s.x*W,s.y*H,s.z,s.z*5)});x.globalAlpha=1;
 enemies.forEach(drawEnemy);
 if(boss){x.save();x.translate(boss.x,boss.y);x.shadowBlur=38;x.shadowColor='#ff3d2f';x.fillStyle='#35141b';x.strokeStyle='#ff644c';x.lineWidth=5;x.beginPath();x.arc(0,0,68,0,Math.PI*2);x.fill();x.stroke();for(let a=0;a<6;a++){x.rotate(Math.PI/3);x.fillStyle='#661f20';x.fillRect(48,-12,42,24)}x.fillStyle='#ff754d';x.beginPath();x.arc(0,0,22,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.font='1000 12px system-ui';x.textAlign='center';x.fillText('4A',0,4);x.restore();x.fillStyle='#35131a';x.fillRect(38,67,W-76,10);x.fillStyle='#ff5841';x.fillRect(38,67,(W-76)*(boss.hp/boss.max),10)}
 lasers.forEach(l=>{x.save();x.shadowBlur=18;x.shadowColor='#54d7ff';x.fillStyle='#e3fbff';x.fillRect(l.x-3,l.y-18,6,22);x.restore()});
 fx.forEach(p=>{x.globalAlpha=p.a;x.fillStyle=p.col;x.fillRect(p.x,p.y,p.s,p.s)});x.globalAlpha=1;if(ship)drawShip();x.restore()
}
function frame(t){let dt=Math.min(32,t-last||16);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function moveTo(clientX){let r=cv.getBoundingClientRect();ship.x=Math.max(38,Math.min(W-38,clientX-r.left))}
let drag=false;cv.addEventListener('pointerdown',e=>{if(!playing)return;drag=true;cv.setPointerCapture(e.pointerId);moveTo(e.clientX)});cv.addEventListener('pointermove',e=>{if(drag&&playing)moveTo(e.clientX)});cv.addEventListener('pointerup',()=>drag=false);cv.addEventListener('pointercancel',()=>drag=false);
addEventListener('keydown',e=>{if(!playing)return;if(e.key==='ArrowLeft'||e.key==='a')ship.x=Math.max(38,ship.x-35);if(e.key==='ArrowRight'||e.key==='d')ship.x=Math.min(W-38,ship.x+35)});
$('#play').onclick=reset;$('#again').onclick=reset;
</script></main></div></body></html>
