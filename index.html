<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#061426">
<title>RESCUE KR JET</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020814;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;color:#fff;touch-action:manipulation}
#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#04101e}
.scene{position:absolute;inset:0;background:url(scene.png) center/cover no-repeat;filter:saturate(1.08) contrast(1.04);transform:scale(1.015);animation:cam 5s ease-in-out infinite alternate}
.vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 45%,#0008 100%);pointer-events:none}
.rain{position:absolute;inset:0;overflow:hidden;pointer-events:none}.rain i{position:absolute;top:-15%;width:2px;height:38px;background:linear-gradient(transparent,#bcefffaa);transform:rotate(14deg);animation:rain linear infinite}
.water{position:absolute;z-index:4;left:-8%;bottom:-8%;width:116%;height:26%;background:linear-gradient(#5ddcff99,#087fb9cc 20%,#03496ccc);box-shadow:0 -9px 30px #45d8ff88;transition:height .7s cubic-bezier(.2,.8,.2,1);animation:swell 1.15s ease-in-out infinite alternate;pointer-events:none}
.water:before{content:"";position:absolute;left:-5%;top:-19px;width:110%;height:35px;background:radial-gradient(ellipse at 50% 100%,#d3f8ff 0 28%,transparent 32%) 0 0/68px 31px repeat-x;animation:wave .85s linear infinite}
.bubbles{position:absolute;inset:0;background-image:radial-gradient(circle,#e5fbff 0 2px,transparent 3px),radial-gradient(circle,#a8efff 0 3px,transparent 4px);background-size:61px 83px,113px 139px;animation:bubbles 3.2s linear infinite;opacity:.65}
.arm{position:absolute;z-index:5;left:14%;top:36%;width:16%;height:9%;border-radius:50%;background:#ffffff0b;transform-origin:85% 50%;animation:arm 1.25s ease-in-out infinite;pointer-events:none}
.flash{position:absolute;z-index:8;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.on{animation:flash .14s 2}
.top{position:absolute;z-index:20;left:2%;right:2%;top:1.8%;display:flex;align-items:center;gap:10px}.logo{font-weight:1000;font-style:italic;font-size:clamp(24px,4.5vw,52px);letter-spacing:-2px;text-shadow:0 0 15px #4fdcff}.logo b{color:#ffb322}.hudrow{margin-left:auto;display:flex;gap:8px}.hud{min-width:105px;padding:7px 11px;border:1px solid #47bdfb;border-radius:12px;background:#061a31e8;box-shadow:0 0 20px #178bd655;text-align:center;font-weight:900}.hud small{display:block;color:#a9d7ef}.hud strong{font-size:20px;color:#fff}.timer strong{color:#ff5962;text-shadow:0 0 10px #ff3344}
.quiz{position:absolute;z-index:22;right:2.2%;top:17%;width:43%;padding:15px;border:2px solid #56c8ff;border-radius:20px;background:linear-gradient(145deg,#09284af5,#06152af7);box-shadow:0 0 30px #1c9fe066}.qhead{display:flex;justify-content:space-between;font-weight:950;color:#a9e3ff}.question{margin:10px 0;padding:15px;min-height:100px;border-radius:13px;background:#edf7ff;color:#10243c;font-size:clamp(17px,2vw,25px);font-weight:950;display:flex;align-items:center}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ans{min-height:65px;border:2px solid #a9cce7;border-radius:12px;background:linear-gradient(#f9fdff,#bed8ec);color:#10243c;font-size:clamp(16px,1.9vw,22px);font-weight:1000;box-shadow:inset 0 0 12px #fff}.ans:active{transform:scale(.97)}.ans.good{background:linear-gradient(#67ff73,#22d74a);border-color:#c5ffca;box-shadow:0 0 24px #2dff56}.ans.bad{background:linear-gradient(#ff8278,#e83737);border-color:#ffc1bc;color:white;box-shadow:0 0 24px #ff443f}
.feedback{margin-top:9px;min-height:58px;border:1px solid #237fa9;border-radius:12px;padding:9px 12px;background:#061f35;font-weight:900}.feedback.good{color:#62ff91;border-color:#31d66c}.feedback.bad{color:#ff8c83;border-color:#e04a43}
.status{position:absolute;z-index:21;left:2%;bottom:4%;width:40%;padding:10px;border:1px solid #42b6eb;border-radius:15px;background:#06192de8}.statusTitle{text-align:center;font-size:12px;color:#b8dff0}.track{height:14px;margin-top:6px;background:#17384f;border-radius:12px;overflow:hidden}.track i{display:block;width:0;height:100%;background:linear-gradient(90deg,#28e793,#ffe55d);transition:.5s}
.gauge{position:absolute;z-index:20;left:2.5%;top:47%;width:58px;height:210px;border:2px solid #a7e7ff;border-radius:15px;background:#06162ad9;padding:8px}.gauge small{display:block;text-align:center;font-weight:900}.tube{position:absolute;left:21px;right:21px;top:39px;bottom:13px;border:1px solid #b9edff;border-radius:10px;overflow:hidden}.tube i{position:absolute;left:0;right:0;bottom:0;height:26%;background:linear-gradient(#64e7ff,#078bc7);transition:.7s}
.speech{position:absolute;z-index:20;left:9%;top:24%;max-width:250px;padding:11px 14px;border-radius:16px;background:#f6fbff;color:#14243a;font-weight:900;box-shadow:0 7px 20px #0007;transform:rotate(-3deg)}
.screen{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 35%,#0c4771,#020713 73%)}.card{text-align:center;width:min(450px,94%)}.big{font-size:clamp(48px,11vw,80px);line-height:.82;font-style:italic;font-weight:1000;text-shadow:0 0 24px #37caff}.big b{color:#ffb52c}.btn{width:100%;min-height:60px;border:1px solid #ffe49c;border-radius:15px;background:linear-gradient(#ffd75b,#e8820a);color:#492400;font-size:20px;font-weight:1000;box-shadow:0 0 25px #ffad2f66}.hidden{display:none!important}
@keyframes cam{to{transform:scale(1.035) translate(-.25%,.15%)}}@keyframes arm{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(8deg) translateY(-8px)}}@keyframes swell{to{transform:translateY(9px)}}@keyframes wave{to{background-position:68px 0}}@keyframes bubbles{to{background-position:0 -180px,0 -260px}}@keyframes rain{to{transform:translate(160px,120vh) rotate(14deg)}}@keyframes flash{50%{opacity:.3}}
@media(max-width:720px){.top{top:1%}.logo{font-size:23px}.hudrow{position:absolute;top:47px;left:0;right:0;justify-content:center}.hud{min-width:83px;padding:4px;font-size:10px}.hud strong{font-size:15px}.scene{background-position:32% center}.quiz{left:2%;right:2%;top:auto;bottom:2%;width:auto;padding:9px}.qhead{font-size:12px}.question{min-height:68px;margin:6px 0;padding:9px;font-size:15px}.ans{min-height:47px;font-size:15px}.feedback{min-height:38px;margin-top:5px;padding:6px;font-size:11px}.status{left:3%;bottom:49%;width:46%;padding:5px}.gauge{top:25%;width:45px;height:140px;font-size:9px}.tube{left:16px;right:16px;top:30px}.speech{top:21%;left:11%;max-width:135px;font-size:10px;padding:7px}.water{height:22%}}
</style></head>
<body><main id="game"><div class="scene"></div><div class="vignette"></div><div id="rain" class="rain"></div><div class="arm"></div><div id="water" class="water"><div class="bubbles"></div></div><div id="flash" class="flash"></div>
<div class="top"><div class="logo"><b>RESCUE</b> KR JET</div><div class="hudrow"><div class="hud timer"><small>เวลาที่เหลือ</small><strong id="time">00:25</strong></div><div class="hud"><small>คะแนน</small><strong id="score">0</strong></div><div class="hud"><small>ด่าน</small><strong id="stage">1/10</strong></div></div></div>
<div id="speech" class="speech">ช่วยครูเจตด้วย! ตอบให้ถูกเพื่อให้น้ำลดลง!</div><div class="gauge"><small>ระดับน้ำ</small><div class="tube"><i id="gfill"></i></div></div>
<section class="quiz"><div class="qhead"><span id="qno">คำถามที่ 1</span><span>กฎของโอห์ม</span></div><div id="q" class="question"></div><div id="answers" class="answers"></div><div id="feed" class="feedback">เลือกคำตอบก่อนเวลาหมด</div></section>
<div class="status"><div class="statusTitle">ความคืบหน้าการช่วยครูเจต</div><div class="track"><i id="prog"></i></div></div>
<section id="menu" class="screen"><div class="card"><div class="big"><b>RESCUE</b><br>KR JET</div><p>ตอบโจทย์กฎของโอห์มให้ทันเวลา<br>ตอบถูก น้ำจะลดลง • ตอบผิด น้ำจะสูงขึ้น</p><button id="start" class="btn">เริ่มช่วยครูเจต</button></div></section>
<section id="end" class="screen hidden"><div class="card"><div class="big"><b>SAFE!</b><br>ช่วยสำเร็จ</div><p id="summary"></p><button id="again" class="btn">เล่นอีกครั้ง</button></div></section>
<script>
const Q=[
["ถ้าแรงดัน 12 V และความต้านทาน 6 Ω กระแสเท่าใด?",["1 A","2 A","3 A","6 A"],1],
["แรงดัน 10 V ต่อกับ 5 Ω กระแสเท่าใด?",["1 A","2 A","5 A","10 A"],1],
["I = 2 A และ R = 5 Ω แรงดัน V เท่าใด?",["5 V","7 V","10 V","12 V"],2],
["V = 20 V และ I = 4 A ค่า R เท่าใด?",["4 Ω","5 Ω","8 Ω","10 Ω"],1],
["9 V ÷ 3 Ω ได้กระแสเท่าใด?",["2 A","3 A","6 A","9 A"],1],
["I = 3 A และ R = 4 Ω ค่า V เท่าใด?",["7 V","12 V","16 V","24 V"],1],
["24 V ÷ 8 Ω ได้กระแสเท่าใด?",["2 A","3 A","4 A","8 A"],1],
["V = 18 V และ I = 3 A ค่า R เท่าใด?",["3 Ω","6 Ω","9 Ω","18 Ω"],1],
["I = 2 A และ R = 6 Ω ค่า V เท่าใด?",["3 V","8 V","12 V","18 V"],2],
["30 V ÷ 10 Ω ได้กระแสเท่าใด?",["2 A","3 A","10 A","30 A"],1]];
const $=s=>document.querySelector(s);let n=0,score=0,correct=0,water=26,t=25,timer,lock=false;
for(let i=0;i<45;i++){let r=document.createElement('i');r.style.left=Math.random()*100+'%';r.style.animationDuration=(.55+Math.random()*.8)+'s';r.style.animationDelay=(-Math.random()*2)+'s';$('#rain').appendChild(r)}
function setWater(v){water=Math.max(15,Math.min(68,v));$('#water').style.height=water+'%';$('#gfill').style.height=water+'%'}
function render(){if(n>=10)return finish();lock=false;t=25;$('#time').textContent='00:25';$('#stage').textContent=(n+1)+'/10';$('#qno').textContent='คำถามที่ '+(n+1);$('#q').textContent=Q[n][0];$('#prog').style.width=correct*10+'%';let a=$('#answers');a.innerHTML='';Q[n][1].forEach((v,i)=>{let b=document.createElement('button');b.className='ans';b.textContent=['ก. ','ข. ','ค. ','ง. '][i]+v;b.onclick=()=>answer(i,b);a.appendChild(b)});$('#feed').className='feedback';$('#feed').textContent='เลือกคำตอบก่อนเวลาหมด'}
function answer(i,b){if(lock)return;lock=true;if(i===Q[n][2]){b.classList.add('good');correct++;score+=100+t*2;setWater(water-6);$('#feed').className='feedback good';$('#feed').textContent='✓ ถูกต้อง! น้ำลดลงแล้ว คุณช่วยครูเจตได้อีกหนึ่งขั้น!';$('#speech').textContent='เก่งมาก! อีกนิดเดียวครับ!'}else{b.classList.add('bad');setWater(water+8);$('#feed').className='feedback bad';$('#feed').textContent='ยังไม่ถูก! คำตอบที่ถูกคือ '+Q[n][1][Q[n][2]];$('#speech').textContent='โอ๊ย! น้ำสูงขึ้นแล้ว ข้อต่อไปช่วยผมด้วย!';$('#flash').classList.add('on');setTimeout(()=>$('#flash').classList.remove('on'),350)}$('#score').textContent=score;$('#prog').style.width=correct*10+'%';setTimeout(()=>{n++;render()},1050)}
function tick(){if(!$('#menu').classList.contains('hidden')||!$('#end').classList.contains('hidden')||lock)return;t--;$('#time').textContent='00:'+String(t).padStart(2,'0');if(t<=0){lock=true;setWater(water+8);$('#feed').className='feedback bad';$('#feed').textContent='หมดเวลา! ระดับน้ำสูงขึ้น';$('#speech').textContent='หมดเวลาแล้ว! ข้อต่อไปต้องเร็วขึ้นครับ!';setTimeout(()=>{n++;render()},900)}}
function start(){n=score=correct=0;setWater(26);$('#score').textContent=0;$('#prog').style.width='0%';$('#menu').classList.add('hidden');$('#end').classList.add('hidden');render();clearInterval(timer);timer=setInterval(tick,1000)}
function finish(){clearInterval(timer);setWater(15);$('#summary').textContent=`ตอบถูก ${correct}/10 ข้อ · คะแนน ${score} · ระบบระบายน้ำทำงานและครูเจตออกจากพื้นที่ได้สำเร็จ`;$('#end').classList.remove('hidden')}
$('#start').onclick=start;$('#again').onclick=start;
</script></main></body></html>
