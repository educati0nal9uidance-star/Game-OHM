<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow"><title>RESCUE KR JET V6</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020813;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;color:white;touch-action:manipulation}
#game{position:relative;width:min(100vw,500px);height:100dvh;margin:auto;overflow:hidden;background:linear-gradient(#071a2b,#0a3550 55%,#04111e);isolation:isolate}
.room{position:absolute;inset:0;background:linear-gradient(90deg,transparent 47%,#12374b55 48% 50%,transparent 51%),linear-gradient(#ffffff08 1px,transparent 1px);background-size:90px 100%,100% 55px}
.pipe{position:absolute;background:#365b68;border:4px solid #1b3440;border-radius:20px;box-shadow:inset 0 0 8px #8ab5bf55}.p1{width:24px;height:230px;left:9%;top:9%}.p2{width:170px;height:22px;left:8%;top:9%}.p3{width:22px;height:190px;right:8%;top:12%}
.alarm{position:absolute;right:12%;top:13%;width:35px;height:35px;border-radius:50% 50% 8px 8px;background:#ff2e27;box-shadow:0 0 25px #ff3c32;animation:alarm .55s infinite alternate}
.spark{position:absolute;left:65%;top:23%;font-size:30px;filter:drop-shadow(0 0 8px #6ceaff);animation:spark .35s infinite alternate}
.logo{position:absolute;z-index:20;left:10px;top:8px;font-weight:1000;font-style:italic;font-size:25px;text-shadow:0 0 13px #55d9ff}.logo b{color:#ffb229}.logo small{display:block;font-size:8px;font-style:normal;letter-spacing:.8px}
.huds{position:absolute;z-index:20;right:7px;top:7px;display:flex;gap:4px}.hud{min-width:57px;padding:4px;border:1px solid #42b9ef;border-radius:8px;background:#061b30dd;text-align:center;font-size:8px;font-weight:900}.hud strong{display:block;font-size:13px}.timer strong{color:#ff656d}
.character{position:absolute;z-index:7;left:11%;top:17%;width:52%;height:42%;transform-origin:50% 75%;animation:float 1.4s ease-in-out infinite}
.body{position:absolute;left:31%;top:39%;width:42%;height:51%;border-radius:20px 20px 10px 10px;background:#c9a36d;border:3px solid #745936;box-shadow:inset 0 0 0 3px #e4c28f}
.shirt{position:absolute;left:47%;top:40%;width:8%;height:46%;background:#d8b581}.belt{position:absolute;left:31%;top:74%;width:42%;height:7%;background:#3e3325;border:2px solid #d7b559}
.pocket{position:absolute;left:36%;top:54%;width:13%;height:11%;border:2px solid #8a6941;border-radius:3px}.badge{position:absolute;left:57%;top:48%;width:11%;height:7%;background:linear-gradient(90deg,#e44 33%,#ffd84e 34% 66%,#49a8ff 67%);border:1px solid #fff7}
.neck{position:absolute;left:44%;top:31%;width:18%;height:15%;background:#d39a70}
.head{position:absolute;z-index:5;left:32%;top:3%;width:43%;height:39%;border-radius:48% 48% 45% 45%;background:#d9a078;border:3px solid #6e4937;transform-origin:50% 85%;animation:head 1.3s ease-in-out infinite}
.hair{position:absolute;left:-2%;top:-6%;width:104%;height:37%;border-radius:55% 55% 35% 35%;background:#17171b;clip-path:polygon(0 75%,8% 25%,18% 40%,27% 4%,39% 31%,50% 0,61% 29%,73% 5%,83% 40%,95% 19%,100% 76%,85% 55%,10% 58%)}
.eye{position:absolute;top:47%;width:9%;height:6%;background:#19191b;border-radius:50%;animation:blink 3.4s infinite}.e1{left:27%}.e2{right:27%}
.brow{position:absolute;top:39%;width:17%;height:4%;background:#39271f;border-radius:8px}.b1{left:20%;transform:rotate(10deg)}.b2{right:20%;transform:rotate(-10deg)}
.mouth{position:absolute;left:38%;top:70%;width:24%;height:15%;border-radius:50%;background:#6d302d;border:2px solid #8a4a42;transition:.2s}
.arm{position:absolute;z-index:3;width:19%;height:48%;background:#c9a36d;border:3px solid #745936;border-radius:18px;transform-origin:50% 8%}
.leftArm{left:18%;top:43%;animation:waveArm .85s ease-in-out infinite}.rightArm{left:68%;top:42%;animation:reachArm 1.05s ease-in-out infinite}
.hand{position:absolute;left:-13%;bottom:-10%;width:125%;height:28%;background:#d9a078;border:3px solid #6e4937;border-radius:50%}
#game.wrong .mouth{height:9%;top:76%;border-radius:50% 50% 15% 15%;background:#59332e}#game.wrong .b1{transform:rotate(-14deg)}#game.wrong .b2{transform:rotate(14deg)}#game.wrong .character{animation:wrong .15s 5}
#game.correct .mouth{top:71%;height:10%;border-radius:10% 10% 50% 50%;background:#7c3a35}#game.correct .character{animation:happy .45s ease}
.speech{position:absolute;z-index:17;right:6%;top:27%;width:132px;padding:8px;border-radius:12px;background:#f7fcff;color:#13253a;font-size:10px;font-weight:900;box-shadow:0 5px 16px #0008}
.water{position:absolute;z-index:10;left:-10%;bottom:36%;width:120%;height:20%;background:linear-gradient(#7ceaffaa,#0a94cbd9 18%,#034d75ef);box-shadow:0 -8px 25px #56ddff88;transition:height .7s;animation:swell .9s ease-in-out infinite alternate}
.wave{position:absolute;left:-5%;top:-16px;width:110%;height:25px;background:radial-gradient(ellipse at 50% 100%,#e2fbff 0 28%,transparent 32%) 0 0/48px 23px repeat-x;animation:wave .65s linear infinite}.foam{position:absolute;inset:0;background-image:radial-gradient(circle,#fff 0 2px,transparent 3px),radial-gradient(circle,#a5edff 0 3px,transparent 4px);background-size:45px 69px,87px 111px;opacity:.55;animation:bubble 2.4s linear infinite}
.quiz{position:absolute;z-index:25;left:8px;right:8px;bottom:8px;height:39%;padding:8px;border:1.5px solid #4ac4ff;border-radius:15px;background:#061a2ef5;box-shadow:0 0 25px #168bd655}.qhead{display:flex;justify-content:space-between;font-size:9px;font-weight:900;color:#9ddfff}.question{min-height:48px;margin:5px 0;padding:7px 9px;border-radius:8px;background:#eff9ff;color:#10243b;font-size:13px;font-weight:950;display:flex;align-items:center}.answers{display:grid;grid-template-columns:1fr 1fr;gap:5px}.ans{min-height:36px;border:1.5px solid #a9cce4;border-radius:8px;background:linear-gradient(#fff,#c6ddeb);color:#10243b;font-size:12px;font-weight:1000}.ans.good{background:#45ef69;box-shadow:0 0 15px #36ff59}.ans.bad{background:#f25b54;color:#fff}.feedback{margin-top:5px;min-height:29px;padding:5px 7px;border:1px solid #28769d;border-radius:8px;background:#072239;font-size:9px;font-weight:900}.feedback.good{color:#60ff94}.feedback.bad{color:#ff938b}
.progress{position:absolute;z-index:18;left:8px;right:8px;top:57%;padding:4px 7px;border:1px solid #38aadd;border-radius:9px;background:#06192ddd}.track{height:6px;background:#17384d;border-radius:8px;overflow:hidden}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ce797,#ffe45d);transition:.4s}
.screen{position:absolute;z-index:60;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 32%,#0c4b70,#020713 74%)}.card{text-align:center;width:94%}.big{font-size:53px;line-height:.82;font-weight:1000;font-style:italic;text-shadow:0 0 23px #42d0ff}.big b{color:#ffb42c}.btn{width:100%;min-height:54px;border:1px solid #ffe49a;border-radius:13px;background:linear-gradient(#ffd65a,#e8860c);color:#4b2500;font-size:18px;font-weight:1000}.hidden{display:none!important}
@keyframes float{50%{transform:translateY(-7px) rotate(1deg)}}@keyframes head{50%{transform:rotate(-4deg)}}@keyframes waveArm{0%,100%{transform:rotate(45deg)}50%{transform:rotate(105deg)}}@keyframes reachArm{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(-58deg) scaleY(1.06)}}@keyframes blink{0%,45%,48%,100%{height:6%}46%,47%{height:1%}}@keyframes wrong{50%{transform:translateX(6px) rotate(2deg)}}@keyframes happy{50%{transform:translateY(-13px) scale(1.03)}}@keyframes swell{to{transform:translateY(7px)}}@keyframes wave{to{background-position:48px 0}}@keyframes bubble{to{background-position:0 -150px,0 -220px}}@keyframes alarm{to{opacity:.35;box-shadow:0 0 8px #ff3c32}}@keyframes spark{to{transform:scale(.7) rotate(12deg);opacity:.35}}
</style></head><body><main id="game"><div class="room"></div><div class="pipe p1"></div><div class="pipe p2"></div><div class="pipe p3"></div><div class="alarm"></div><div class="spark">ϟ</div>
<div class="logo"><b>RESCUE</b> KR JET<small>OHM'S LAW RESCUE</small></div><div class="huds"><div class="hud timer">เวลา<strong id="time">20</strong></div><div class="hud">คะแนน<strong id="score">0</strong></div><div class="hud">ด่าน<strong id="stage">1/10</strong></div></div>
<div class="character"><div class="arm leftArm"><div class="hand"></div></div><div class="arm rightArm"><div class="hand"></div></div><div class="body"></div><div class="shirt"></div><div class="belt"></div><div class="pocket"></div><div class="badge"></div><div class="neck"></div><div class="head"><div class="hair"></div><div class="brow b1"></div><div class="brow b2"></div><div class="eye e1"></div><div class="eye e2"></div><div class="mouth"></div></div></div>
<div id="speech" class="speech">ช่วยตอบให้ถูกครับ! น้ำกำลังสูงขึ้น!</div><div id="water" class="water"><div class="wave"></div><div class="foam"></div></div><div class="progress"><div class="track"><i id="prog"></i></div></div>
<section class="quiz"><div class="qhead"><span id="qno">คำถามที่ 1</span><span>กฎของโอห์ม</span></div><div id="q" class="question"></div><div id="answers" class="answers"></div><div id="feed" class="feedback">เลือกคำตอบก่อนเวลาหมด</div></section>
<section id="menu" class="screen"><div class="card"><div class="big"><b>RESCUE</b><br>KR JET</div><p>เวอร์ชันการ์ตูน — ตัวละครขยับจริงด้วย CSS</p><button id="start" class="btn">เริ่มเกม</button></div></section>
<section id="end" class="screen hidden"><div class="card"><div class="big"><b>SAFE!</b><br>สำเร็จ</div><p id="summary"></p><button id="again" class="btn">เล่นอีกครั้ง</button></div></section>
<script>
const Q=[["12 V ÷ 6 Ω = ?",["1 A","2 A","3 A","6 A"],1],["10 V ÷ 5 Ω = ?",["1 A","2 A","5 A","10 A"],1],["I=2 A, R=5 Ω → V=?",["5 V","7 V","10 V","12 V"],2],["V=20 V, I=4 A → R=?",["4 Ω","5 Ω","8 Ω","10 Ω"],1],["9 V ÷ 3 Ω = ?",["2 A","3 A","6 A","9 A"],1],["I=3 A, R=4 Ω → V=?",["7 V","12 V","16 V","24 V"],1],["24 V ÷ 8 Ω = ?",["2 A","3 A","4 A","8 A"],1],["18 V ÷ 3 A → R=?",["3 Ω","6 Ω","9 Ω","18 Ω"],1],["I=2 A, R=6 Ω → V=?",["3 V","8 V","12 V","18 V"],2],["30 V ÷ 10 Ω = ?",["2 A","3 A","10 A","30 A"],1]];
const $=s=>document.querySelector(s),g=$('#game');let n=0,score=0,correct=0,water=20,t=20,timer,lock=false;
function setWater(v){water=Math.max(12,Math.min(60,v));$('#water').style.height=water+'%'}
function state(s){g.classList.remove('wrong','correct');void g.offsetWidth;g.classList.add(s);setTimeout(()=>g.classList.remove(s),850)}
function render(){if(n>=10)return finish();lock=false;t=20;$('#time').textContent=t;$('#stage').textContent=(n+1)+'/10';$('#qno').textContent='คำถามที่ '+(n+1);$('#q').textContent=Q[n][0];let a=$('#answers');a.innerHTML='';Q[n][1].forEach((v,i)=>{let b=document.createElement('button');b.className='ans';b.textContent=['ก. ','ข. ','ค. ','ง. '][i]+v;b.onclick=()=>answer(i,b);a.appendChild(b)});$('#feed').className='feedback';$('#feed').textContent='เลือกคำตอบก่อนเวลาหมด'}
function answer(i,b){if(lock)return;lock=true;if(i===Q[n][2]){b.classList.add('good');correct++;score+=100+t*2;setWater(water-6);state('correct');$('#speech').textContent='เยี่ยม! น้ำลดแล้วครับ!';$('#feed').className='feedback good';$('#feed').textContent='✓ ถูกต้อง!'}else{b.classList.add('bad');setWater(water+8);state('wrong');$('#speech').textContent='โอ๊ะ! น้ำสูงขึ้นแล้ว ข้อต่อไปเอาใหม่!';$('#feed').className='feedback bad';$('#feed').textContent='ผิด — คำตอบ '+Q[n][1][Q[n][2]]}$('#score').textContent=score;$('#prog').style.width=correct*10+'%';setTimeout(()=>{n++;render()},950)}
function tick(){if(!$('#menu').classList.contains('hidden')||!$('#end').classList.contains('hidden')||lock)return;t--;$('#time').textContent=t;if(t<=0){lock=true;setWater(water+8);state('wrong');$('#feed').className='feedback bad';$('#feed').textContent='หมดเวลา!';setTimeout(()=>{n++;render()},850)}}
function start(){n=score=correct=0;setWater(20);$('#score').textContent=0;$('#prog').style.width=0;$('#menu').classList.add('hidden');$('#end').classList.add('hidden');render();clearInterval(timer);timer=setInterval(tick,1000)}
function finish(){clearInterval(timer);setWater(12);$('#summary').textContent=`ตอบถูก ${correct}/10 ข้อ · ${score} คะแนน`;$('#end').classList.remove('hidden')}
$('#start').onclick=start;$('#again').onclick=start;
</script></main></body></html>
