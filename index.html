<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#030912">
<title>RESCUE KR JET — Animated Flood</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02060c;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}
#game{position:relative;width:min(100vw,1180px);height:100dvh;max-height:820px;margin:auto;overflow:hidden;background:radial-gradient(circle at 27% 32%,#174a67,#07121d 48%,#02060c)}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:7;pointer-events:none}.wall{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 88px,#8296a511 90px 94px),linear-gradient(#17202a,#06111c 72%)}
.pipe{position:absolute;border:18px solid #3e4a54;border-radius:40px;box-shadow:inset 0 0 10px #9ba7ad55,0 8px 20px #0008}.p1{left:-70px;top:110px;width:300px;height:160px}.p2{left:320px;top:40px;width:150px;height:380px}
.logo{position:absolute;z-index:20;left:18px;top:12px;font-size:clamp(27px,5vw,54px);font-weight:1000;font-style:italic;letter-spacing:-3px;text-shadow:0 0 15px #38c6ff}.logo b{color:#ffb127}.logo small{display:block;font-size:11px;letter-spacing:1px;color:#cbeeff;font-style:normal}
.huds{position:absolute;z-index:20;right:16px;top:12px;display:flex;gap:8px}.hud{min-width:105px;padding:7px 12px;border:1px solid #328fc7;border-radius:12px;background:#061b2be8;text-align:center;font-weight:900}.hud small{display:block;color:#9dcce6}.hud strong{font-size:21px;color:#72dcff}
.scene{position:absolute;left:0;top:82px;bottom:0;width:50%;overflow:hidden}.alarm{position:absolute;left:44%;top:2%;width:52px;height:52px;border-radius:50% 50% 12px 12px;background:#ff3e31;box-shadow:0 0 25px #ff2a1e;animation:alarm .6s infinite alternate}.machine{position:absolute;left:50%;top:2%;transform:translateX(-50%);width:250px;height:80px;border:12px solid #58646d;border-radius:50%;background:#17222d;box-shadow:0 0 30px #3ecaff}.machine:after{content:"⚡";position:absolute;left:50%;top:45px;transform:translateX(-50%);font-size:34px;color:#d8f7ff;text-shadow:0 0 15px #36c8ff}
.personWrap{position:absolute;z-index:5;left:50%;bottom:35px;width:min(58%,300px);height:72%;transform:translateX(-50%);animation:struggle 1.65s ease-in-out infinite}.person{width:100%;height:100%;object-fit:cover;object-position:50% 18%;border-radius:42% 42% 8% 8%/17% 17% 5% 5%;filter:contrast(1.06) saturate(.92);box-shadow:0 0 35px #3bcaff66}.personWrap:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(transparent 45%,#0b385399)}
.chain{position:absolute;z-index:10;left:12%;width:76%;height:16px;border:2px solid #a5dcff;border-radius:14px;background:repeating-linear-gradient(90deg,#071019 0 14px,#88b9da 15px 21px,#071019 22px 35px);box-shadow:0 0 12px #45bfff;transition:.65s}.c1{bottom:29%;transform:rotate(-9deg)}.c2{bottom:40%;transform:rotate(8deg)}.c3{bottom:51%;transform:rotate(-5deg)}.c4{bottom:62%;transform:rotate(6deg)}.chain.off{opacity:0;translate:0 180px;rotate:45deg}
.water{position:absolute;z-index:8;left:-10%;bottom:-3%;width:120%;height:17%;transition:height .85s cubic-bezier(.22,.8,.3,1);background:linear-gradient(#65ddffbb,#087bb5e8 20%,#034d7bed);box-shadow:0 -12px 28px #4fd4ff88;animation:swell 1.4s ease-in-out infinite alternate}.water:before,.water:after{content:"";position:absolute;left:-5%;top:-18px;width:110%;height:30px;background:radial-gradient(ellipse at 50% 100%,#b6f2ff 0 32%,transparent 35%) 0 0/62px 27px repeat-x;animation:wave 1.1s linear infinite}.water:after{top:-8px;opacity:.45;background-size:43px 20px;animation-direction:reverse}
.bubbles{position:absolute;inset:0;background-image:radial-gradient(circle,#d9f8ff 0 2px,transparent 3px),radial-gradient(circle,#a9ecff 0 3px,transparent 4px);background-size:61px 79px,103px 131px;animation:bubbles 3.2s linear infinite;opacity:.65}
.gauge{position:absolute;z-index:15;left:3%;bottom:11%;height:43%;width:28px;border:2px solid #b4ebff;border-radius:15px;background:#031422bb;overflow:hidden}.gfill{position:absolute;bottom:0;left:0;right:0;height:17%;background:linear-gradient(#6be4ff,#058bc8);transition:height .85s}.speech{position:absolute;z-index:15;left:2%;top:22%;width:35%;padding:12px;background:#f6fbff;color:#13253b;border-radius:17px;font-weight:850;box-shadow:0 8px 24px #0007;transition:.2s}.danger{animation:danger .28s 3}
.panel{position:absolute;z-index:18;right:18px;top:90px;bottom:18px;width:48%;padding:17px;border:2px solid #32b7ff;border-radius:22px;background:linear-gradient(145deg,#0b3150f2,#06182df8);box-shadow:0 0 32px #168ee055;display:flex;flex-direction:column}.qhead{display:flex;justify-content:space-between;color:#8edcff;font-weight:900}.question{margin:11px 0;background:#f1f8ff;color:#10243d;border-radius:14px;padding:17px;min-height:105px;display:flex;align-items:center;font-size:clamp(17px,2.2vw,25px);font-weight:950}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ans{min-height:67px;border:2px solid #9fc3de;border-radius:13px;background:linear-gradient(#fbfdff,#c4daeb);color:#10243d;font-size:clamp(16px,2vw,22px);font-weight:1000;transition:.15s}.ans:active{transform:scale(.97)}.ans.good{background:#43eb6b;border-color:#b3ffc0;box-shadow:0 0 22px #34ff65}.ans.bad{background:#ff625b;border-color:#ffb3ae;color:white}.feedback{margin-top:11px;min-height:57px;border:1px solid #286d94;border-radius:12px;background:#08243a;padding:9px 12px;font-weight:850}.progress{margin-top:auto}.pt{font-size:11px;color:#b8d7e9;text-align:center}.track{height:12px;background:#17334a;border-radius:10px;overflow:hidden}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#29e798,#ffe263);transition:.5s}
.screen{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle,#10496b,#020711 72%)}.card{text-align:center;width:min(440px,95%)}.big{font-size:clamp(48px,12vw,80px);line-height:.82;font-weight:1000;font-style:italic;text-shadow:0 0 25px #35c7ff}.big b{color:#ffb42d}.btn{width:100%;min-height:60px;border:1px solid #ffe091;border-radius:15px;background:linear-gradient(#ffd452,#e8820b);font-size:20px;font-weight:1000;color:#4a2500;box-shadow:0 0 25px #ffae2d66}.hidden{display:none!important}
@keyframes alarm{to{filter:brightness(2);box-shadow:0 0 55px #ff2a1e}}@keyframes struggle{0%,100%{transform:translateX(-50%) rotate(-1deg)}50%{transform:translateX(-50%) rotate(1.4deg) translateY(-5px)}}@keyframes swell{to{transform:translateY(8px)}}@keyframes wave{to{background-position:62px 0}}@keyframes bubbles{to{background-position:0 -180px,0 -260px}}@keyframes danger{50%{transform:translateX(7px);filter:brightness(1.5)}}
@media(max-width:720px){.logo{font-size:25px}.huds{top:53px;left:6px;right:6px;justify-content:center}.hud{min-width:83px;padding:4px 6px;font-size:10px}.hud strong{font-size:15px}.scene{top:96px;width:100%;height:42%;bottom:auto}.machine{width:165px;height:55px}.machine:after{top:30px}.personWrap{width:135px;height:75%;bottom:8px}.speech{top:17%;width:29%;font-size:10px;padding:7px}.chain{left:25%;width:50%;height:10px}.c1{bottom:25%}.c2{bottom:37%}.c3{bottom:49%}.c4{bottom:61%}.gauge{height:34%}.panel{left:7px;right:7px;top:45%;bottom:7px;width:auto;padding:10px}.question{min-height:72px;margin:6px 0;padding:9px;font-size:16px}.ans{min-height:48px;font-size:15px}.feedback{min-height:38px;margin-top:6px;padding:6px;font-size:11px}.progress{margin-top:5px}}
</style></head><body><main id="game"><div class="wall"></div><div class="pipe p1"></div><div class="pipe p2"></div><canvas id="fx"></canvas><div class="logo"><b>RESCUE</b> KR JET<small>FLOOD ESCAPE · OHM'S LAW</small></div>
<div class="huds"><div class="hud"><small>เวลา</small><strong id="time">00:25</strong></div><div class="hud"><small>คะแนน</small><strong id="score">0</strong></div><div class="hud"><small>ด่าน</small><strong id="stage">1/10</strong></div></div>
<section class="scene"><div class="alarm"></div><div class="machine"></div><div id="speech" class="speech">ช่วยตอบให้ถูกครับ! น้ำกำลังสูงขึ้น!</div><div id="person" class="personWrap"><img class="person" src="teacher.jpg"></div><div id="c1" class="chain c1"></div><div id="c2" class="chain c2"></div><div id="c3" class="chain c3"></div><div id="c4" class="chain c4"></div><div class="gauge"><div id="gfill" class="gfill"></div></div><div id="water" class="water"><div class="bubbles"></div></div></section>
<section class="panel"><div class="qhead"><span id="qno">คำถามที่ 1</span><span>กฎของโอห์ม</span></div><div id="q" class="question"></div><div id="answers" class="answers"></div><div id="feed" class="feedback">เลือกคำตอบก่อนเวลาหมด</div><div class="progress"><div class="pt">ความคืบหน้าการช่วยครูเจต</div><div class="track"><i id="prog"></i></div></div></section>
<section id="menu" class="screen"><div class="card"><div class="big"><b>RESCUE</b><br>KR JET</div><p>ตอบโจทย์ง่าย ๆ ให้ทันเวลา<br>ตอบถูก → น้ำลด + ปลดโซ่<br>ตอบผิด/หมดเวลา → น้ำสูงขึ้น</p><button id="start" class="btn">เริ่มภารกิจ</button></div></section>
<section id="end" class="screen hidden"><div class="card"><div class="big"><b>SAFE!</b><br>ช่วยสำเร็จ</div><p id="summary"></p><button id="again" class="btn">เล่นอีกครั้ง</button></div></section>
<script>
const Q=[
["12 V ÷ 6 Ω = กระแสเท่าใด?",["1 A","2 A","3 A","6 A"],1],["10 V ÷ 5 Ω = ?",["1 A","2 A","5 A","10 A"],1],
["I = 2 A, R = 5 Ω → V = ?",["5 V","7 V","10 V","12 V"],2],["V = 20 V, I = 4 A → R = ?",["4 Ω","5 Ω","8 Ω","10 Ω"],1],
["9 V ÷ 3 Ω = ?",["2 A","3 A","6 A","9 A"],1],["I = 3 A, R = 4 Ω → V = ?",["7 V","12 V","16 V","24 V"],1],
["24 V ÷ 8 Ω = ?",["2 A","3 A","4 A","8 A"],1],["V = 18 V, I = 3 A → R = ?",["3 Ω","6 Ω","9 Ω","18 Ω"],1],
["I = 2 A, R = 6 Ω → V = ?",["3 V","8 V","12 V","18 V"],2],["30 V ÷ 10 Ω = ?",["2 A","3 A","10 A","30 A"],1]];
const $=s=>document.querySelector(s);let n=0,score=0,correct=0,water=17,t=25,timer,lock=false;
function setWater(v){water=Math.max(10,Math.min(78,v));$('#water').style.height=water+'%';$('#gfill').style.height=water+'%'}
function chain(){let k=Math.floor(correct/2);for(let i=1;i<=4;i++)$('#c'+i).classList.toggle('off',i<=k);$('#prog').style.width=correct*10+'%'}
function render(){if(n>=10)return finish();lock=false;t=25;$('#time').textContent='00:25';$('#stage').textContent=(n+1)+'/10';$('#qno').textContent='คำถามที่ '+(n+1);$('#q').textContent=Q[n][0];let a=$('#answers');a.innerHTML='';Q[n][1].forEach((v,i)=>{let b=document.createElement('button');b.className='ans';b.textContent=['ก. ','ข. ','ค. ','ง. '][i]+v;b.onclick=()=>answer(i,b);a.appendChild(b)});$('#feed').textContent='เลือกคำตอบก่อนเวลาหมด'}
function answer(i,b){if(lock)return;lock=true;if(i===Q[n][2]){b.classList.add('good');correct++;score+=100+t*2;setWater(water-8);chain();$('#feed').textContent='ถูกต้อง! น้ำลดลงและปลดระบบช่วยเหลืออีกขั้น';$('#speech').textContent='ดีมากครับ! ช่วยต่ออีกนิด!';splash('#69ffbd')}else{b.classList.add('bad');setWater(water+10);$('#feed').textContent='ยังไม่ถูก! น้ำเพิ่มขึ้น — คำตอบ '+Q[n][1][Q[n][2]];$('#speech').textContent='น้ำสูงขึ้นแล้วครับ! รีบช่วยข้อต่อไป!';$('#person').classList.add('danger');setTimeout(()=>$('#person').classList.remove('danger'),700);splash('#ff7c64')}$('#score').textContent=score;setTimeout(()=>{n++;render()},1050)}
function tick(){if(!$('#menu').classList.contains('hidden')||!$('#end').classList.contains('hidden')||lock)return;t--;$('#time').textContent='00:'+String(t).padStart(2,'0');if(t<=0){lock=true;setWater(water+11);$('#feed').textContent='หมดเวลา! ระดับน้ำเพิ่มขึ้น';$('#speech').textContent='หมดเวลาแล้วครับ! ข้อต่อไปต้องเร็วขึ้น!';splash('#ff6655');setTimeout(()=>{n++;render()},900)}}
function start(){n=score=correct=0;setWater(17);chain();$('#score').textContent=0;$('#menu').classList.add('hidden');$('#end').classList.add('hidden');render();clearInterval(timer);timer=setInterval(tick,1000)}
function finish(){clearInterval(timer);setWater(10);for(let i=1;i<=4;i++)$('#c'+i).classList.add('off');$('#summary').textContent=`ตอบถูก ${correct}/10 ข้อ · ${score} คะแนน · ระบบระบายน้ำทำงานและทางออกเปิดแล้ว`;$('#end').classList.remove('hidden')}
$('#start').onclick=start;$('#again').onclick=start;

// Canvas animation: rain, spray, electric arcs.
const cv=$('#fx'),x=cv.getContext('2d');let W,H,dpr,drops=[],sparks=[];
function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size);size();
for(let i=0;i<85;i++)drops.push({x:Math.random(),y:Math.random(),v:2+Math.random()*5,l:5+Math.random()*14});
function splash(col){for(let i=0;i<45;i++)sparks.push({x:W*.25,y:H*.58,vx:(Math.random()-.5)*10,vy:-Math.random()*8,a:1,col})}
function arc(ax,ay,bx,by){x.beginPath();x.moveTo(ax,ay);let seg=8;for(let i=1;i<seg;i++){let q=i/seg;x.lineTo(ax+(bx-ax)*q+(Math.random()-.5)*12,ay+(by-ay)*q+(Math.random()-.5)*12)}x.lineTo(bx,by);x.strokeStyle='#a9ecff';x.lineWidth=1.5;x.shadowBlur=10;x.shadowColor='#42bfff';x.stroke();x.shadowBlur=0}
function anim(){x.clearRect(0,0,W,H);x.strokeStyle='#9edfff55';drops.forEach(d=>{d.y+=d.v/H;if(d.y>1){d.y=0;d.x=Math.random()}x.beginPath();x.moveTo(d.x*W,d.y*H);x.lineTo(d.x*W-2,d.y*H+d.l);x.stroke()});if(Math.random()<.08)arc(W*.18,H*.15,W*.36,H*.31);sparks.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=.28;s.a-=.025;x.globalAlpha=Math.max(0,s.a);x.fillStyle=s.col;x.fillRect(s.x,s.y,3,3)});x.globalAlpha=1;sparks=sparks.filter(s=>s.a>0);requestAnimationFrame(anim)}anim();
</script></main></body></html>
