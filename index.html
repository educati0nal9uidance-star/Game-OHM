<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow"><title>RESCUE KR JET V8</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020813;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}
#game{position:relative;width:min(100vw,500px);height:100dvh;margin:auto;overflow:hidden;background:linear-gradient(#06172b,#0b3854 56%,#04101d);isolation:isolate}
.room{position:absolute;inset:0;background:linear-gradient(90deg,transparent 49%,#ffffff0b 50%,transparent 51%),linear-gradient(#ffffff09 1px,transparent 1px);background-size:86px 100%,100% 56px}
.pipe{position:absolute;background:#41616d;border:4px solid #1b3440;border-radius:18px;box-shadow:inset 0 0 9px #9cc8d055}.p1{left:7%;top:8%;width:25px;height:230px}.p2{left:7%;top:8%;width:170px;height:25px}.p3{right:8%;top:12%;width:24px;height:190px}
.alarm{position:absolute;right:15%;top:13%;width:36px;height:36px;border-radius:50% 50% 8px 8px;background:#ff3b32;box-shadow:0 0 30px #ff3b32;animation:alarm .55s infinite alternate}
.logo{position:absolute;z-index:30;left:9px;top:7px;font-size:25px;font-weight:1000;font-style:italic;text-shadow:0 0 13px #4fd9ff}.logo b{color:#ffb329}.logo small{display:block;font-size:8px;font-style:normal;letter-spacing:.7px}
.huds{position:absolute;z-index:30;right:7px;top:7px;display:flex;gap:4px}.hud{min-width:57px;padding:4px;border:1px solid #45b9ef;border-radius:8px;background:#061b31e8;text-align:center;font-size:8px;font-weight:900}.hud strong{display:block;font-size:13px}.timer strong{color:#ff626b}
#teacher{position:absolute;z-index:8;left:4%;top:13%;width:69%;height:47%;overflow:visible;animation:bob 1.45s ease-in-out infinite}
#headGroup{transform-box:fill-box;transform-origin:50% 80%;animation:head 1.7s ease-in-out infinite}
#armL{transform-box:fill-box;transform-origin:85% 15%;animation:armL .85s ease-in-out infinite}
#armR{transform-box:fill-box;transform-origin:20% 15%;animation:armR 1.05s ease-in-out infinite}
#eyes{animation:blink 3.3s infinite;transform-origin:center;transform-box:fill-box}
#mouthSmile,#mouthSad{display:none}
#game.correct #mouthOpen{display:none}#game.correct #mouthSmile{display:block}
#game.wrong #mouthOpen{display:none}#game.wrong #mouthSad{display:block}
#game.wrong #teacher{animation:shake .13s 7}
#game.correct #teacher{animation:jump .5s ease}
#game.wrong #browL{transform:rotate(-15deg);transform-origin:center}#game.wrong #browR{transform:rotate(15deg);transform-origin:center}
.speech{position:absolute;z-index:20;right:5%;top:26%;width:125px;padding:7px;border-radius:12px;background:#f8fcff;color:#12253a;font-size:10px;font-weight:900;box-shadow:0 5px 18px #0008}
.water{position:absolute;z-index:12;left:-10%;bottom:36%;width:120%;height:18%;background:linear-gradient(#a8efff9c,#1398ccd9 18%,#034e75f2);box-shadow:0 -9px 28px #59dfff99;transition:height .7s;animation:swell .9s ease-in-out infinite alternate;pointer-events:none}
.wave,.wave2{position:absolute;left:-5%;width:110%;height:28px;background:radial-gradient(ellipse at 50% 100%,#e3fbff 0 28%,transparent 32%) 0 0/49px 25px repeat-x}.wave{top:-18px;animation:wave .65s linear infinite}.wave2{top:-8px;opacity:.45;background-size:37px 20px;animation:wave2 .55s linear infinite}
.bubbles{position:absolute;inset:0;background-image:radial-gradient(circle,#fff 0 2px,transparent 3px),radial-gradient(circle,#a6efff 0 3px,transparent 4px);background-size:47px 71px,91px 117px;opacity:.58;animation:bubble 2.4s linear infinite}
.rain{position:absolute;z-index:15;inset:0;overflow:hidden;pointer-events:none}.rain i{position:absolute;top:-15%;width:1.5px;height:30px;background:linear-gradient(transparent,#d9f7ffb5);transform:rotate(12deg);animation:rain linear infinite}
.progress{position:absolute;z-index:20;left:9px;right:9px;top:56%;padding:5px 8px;border:1px solid #3daee1;border-radius:10px;background:#06192dde}.track{height:7px;background:#17384d;border-radius:8px;overflow:hidden}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#29e695,#ffe35c);transition:.4s}
.quiz{position:absolute;z-index:25;left:8px;right:8px;bottom:8px;height:39%;padding:8px;border:1.5px solid #4bc5ff;border-radius:15px;background:#061a2ef8;box-shadow:0 0 26px #168bd655}.qhead{display:flex;justify-content:space-between;font-size:9px;font-weight:900;color:#9de1ff}.question{min-height:48px;margin:5px 0;padding:7px 9px;border-radius:8px;background:#eff9ff;color:#10243b;font-size:13px;font-weight:950;display:flex;align-items:center}.answers{display:grid;grid-template-columns:1fr 1fr;gap:5px}.ans{min-height:36px;border:1.5px solid #aacce4;border-radius:8px;background:linear-gradient(#fff,#c6ddeb);color:#10243b;font-size:12px;font-weight:1000}.ans.good{background:#45ef68;box-shadow:0 0 16px #34ff58}.ans.bad{background:#f15a53;color:#fff}.feedback{margin-top:5px;min-height:29px;padding:5px 7px;border:1px solid #28769d;border-radius:8px;background:#072239;font-size:9px;font-weight:900}.feedback.good{color:#61ff95}.feedback.bad{color:#ff938a}
.screen{position:absolute;z-index:60;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 32%,#0c496f,#020713 74%)}.card{text-align:center;width:94%}.big{font-size:53px;line-height:.82;font-weight:1000;font-style:italic;text-shadow:0 0 23px #42d0ff}.big b{color:#ffb42c}.btn{width:100%;min-height:54px;border:1px solid #ffe49a;border-radius:13px;background:linear-gradient(#ffd65a,#e8860c);color:#4b2500;font-size:18px;font-weight:1000}.hidden{display:none!important}
@keyframes bob{50%{transform:translateY(-7px) rotate(.7deg)}}@keyframes head{50%{transform:rotate(-5deg)}}@keyframes armL{0%,100%{transform:rotate(15deg)}50%{transform:rotate(-38deg) translate(-4px,-7px)}}@keyframes armR{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(25deg) translate(5px,-4px)}}@keyframes blink{0%,46%,49%,100%{transform:scaleY(1)}47%,48%{transform:scaleY(.08)}}@keyframes shake{50%{transform:translateX(7px) rotate(2deg)}}@keyframes jump{50%{transform:translateY(-14px) scale(1.03)}}@keyframes swell{to{transform:translateY(7px)}}@keyframes wave{to{background-position:49px 0}}@keyframes wave2{to{background-position:-37px 0}}@keyframes bubble{to{background-position:0 -155px,0 -225px}}@keyframes rain{to{transform:translate(100px,120vh) rotate(12deg)}}@keyframes alarm{to{opacity:.3;box-shadow:0 0 8px #ff3b32}}
</style></head><body><main id="game"><div class="room"></div><div class="pipe p1"></div><div class="pipe p2"></div><div class="pipe p3"></div><div class="alarm"></div>
<div class="logo"><b>RESCUE</b> KR JET<small>OHM'S LAW RESCUE</small></div><div class="huds"><div class="hud timer">เวลา<strong id="time">20</strong></div><div class="hud">คะแนน<strong id="score">0</strong></div><div class="hud">ด่าน<strong id="stage">1/10</strong></div></div>
<svg id="teacher" viewBox="0 0 300 390" aria-label="animated cartoon teacher">
 <g id="armL"><rect x="42" y="183" width="48" height="145" rx="24" fill="#c89d65" stroke="#674b30" stroke-width="5"/><ellipse cx="65" cy="327" rx="31" ry="28" fill="#d9a078" stroke="#674b30" stroke-width="5"/></g>
 <g id="armR"><rect x="212" y="181" width="47" height="145" rx="24" fill="#c89d65" stroke="#674b30" stroke-width="5"/><ellipse cx="236" cy="326" rx="30" ry="27" fill="#d9a078" stroke="#674b30" stroke-width="5"/></g>
 <path d="M85 175 Q150 145 217 176 L230 340 Q150 370 72 340Z" fill="#caa36b" stroke="#674b30" stroke-width="6"/>
 <path d="M142 168 L158 168 L158 340 L142 340Z" fill="#dfbd88"/><path d="M75 285 L229 285 L229 307 L75 307Z" fill="#493825"/><rect x="142" y="284" width="22" height="24" rx="3" fill="#e3bd55" stroke="#604923" stroke-width="3"/>
 <path d="M92 178 L119 163 L132 188 L107 199Z" fill="#b9905d" stroke="#674b30" stroke-width="4"/><path d="M208 178 L181 163 L168 188 L193 199Z" fill="#b9905d" stroke="#674b30" stroke-width="4"/>
 <rect x="101" y="226" width="39" height="30" rx="4" fill="none" stroke="#81613d" stroke-width="4"/><rect x="174" y="220" width="30" height="8" fill="#e54e45"/><rect x="174" y="230" width="30" height="8" fill="#ffd451"/>
 <g id="headGroup"><rect x="132" y="137" width="38" height="43" rx="15" fill="#d49b72"/><ellipse cx="151" cy="100" rx="70" ry="76" fill="#d9a078" stroke="#674b30" stroke-width="6"/>
  <path d="M82 87 Q83 21 151 18 Q220 19 221 91 Q202 68 186 57 Q168 73 151 55 Q130 75 109 55 Q96 73 82 87Z" fill="#17171b"/>
  <path d="M92 55 Q109 13 153 18 Q197 15 216 58 Q194 44 178 47 Q163 33 145 48 Q126 31 111 51Z" fill="#202026"/>
  <g id="eyes"><ellipse cx="122" cy="105" rx="8" ry="6" fill="#17171b"/><ellipse cx="180" cy="105" rx="8" ry="6" fill="#17171b"/></g>
  <path id="browL" d="M105 89 Q121 82 136 89" fill="none" stroke="#38251e" stroke-width="5" stroke-linecap="round"/><path id="browR" d="M166 89 Q181 82 196 90" fill="none" stroke="#38251e" stroke-width="5" stroke-linecap="round"/>
  <path d="M150 106 L145 130 Q151 135 158 130" fill="none" stroke="#a36e55" stroke-width="4" stroke-linecap="round"/>
  <ellipse id="mouthOpen" cx="151" cy="151" rx="18" ry="13" fill="#6b302d"/><path id="mouthSmile" d="M132 145 Q151 165 171 144" fill="none" stroke="#6b302d" stroke-width="6" stroke-linecap="round"/><path id="mouthSad" d="M133 158 Q151 139 170 158" fill="none" stroke="#6b302d" stroke-width="6" stroke-linecap="round"/>
 </g>
</svg>
<div id="speech" class="speech">ช่วยตอบให้ถูกครับ! แขนผมขยับจริงแล้ว!</div><div id="rain" class="rain"></div><div id="water" class="water"><div class="wave"></div><div class="wave2"></div><div class="bubbles"></div></div><div class="progress"><div class="track"><i id="prog"></i></div></div>
<section class="quiz"><div class="qhead"><span id="qno">คำถามที่ 1</span><span>กฎของโอห์ม</span></div><div id="q" class="question"></div><div id="answers" class="answers"></div><div id="feed" class="feedback">เลือกคำตอบก่อนเวลาหมด</div></section>
<section id="menu" class="screen"><div class="card"><div class="big"><b>RESCUE</b><br>KR JET</div><p>V8 — ตัวละคร SVG แยกหัว แขน ตา และปาก<br>จึงขยับเป็นชิ้นส่วนจริง</p><button id="start" class="btn">เริ่มเกม</button></div></section>
<section id="end" class="screen hidden"><div class="card"><div class="big"><b>SAFE!</b><br>สำเร็จ</div><p id="summary"></p><button id="again" class="btn">เล่นอีกครั้ง</button></div></section>
<script>
const Q=[["12 V ÷ 6 Ω = ?",["1 A","2 A","3 A","6 A"],1],["10 V ÷ 5 Ω = ?",["1 A","2 A","5 A","10 A"],1],["I=2 A, R=5 Ω → V=?",["5 V","7 V","10 V","12 V"],2],["V=20 V, I=4 A → R=?",["4 Ω","5 Ω","8 Ω","10 Ω"],1],["9 V ÷ 3 Ω = ?",["2 A","3 A","6 A","9 A"],1],["I=3 A, R=4 Ω → V=?",["7 V","12 V","16 V","24 V"],1],["24 V ÷ 8 Ω = ?",["2 A","3 A","4 A","8 A"],1],["18 V ÷ 3 A → R=?",["3 Ω","6 Ω","9 Ω","18 Ω"],1],["I=2 A, R=6 Ω → V=?",["3 V","8 V","12 V","18 V"],2],["30 V ÷ 10 Ω = ?",["2 A","3 A","10 A","30 A"],1]];
const $=s=>document.querySelector(s),g=$('#game');let n=0,score=0,correct=0,water=18,t=20,timer,lock=false;
for(let i=0;i<35;i++){let e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.animationDuration=(.55+Math.random()*.8)+'s';e.style.animationDelay=(-Math.random()*2)+'s';$('#rain').appendChild(e)}
function setWater(v){water=Math.max(11,Math.min(60,v));$('#water').style.height=water+'%'}
function state(s){g.classList.remove('wrong','correct');void g.offsetWidth;g.classList.add(s);setTimeout(()=>g.classList.remove(s),900)}
function render(){if(n>=10)return finish();lock=false;t=20;$('#time').textContent=t;$('#stage').textContent=(n+1)+'/10';$('#qno').textContent='คำถามที่ '+(n+1);$('#q').textContent=Q[n][0];let a=$('#answers');a.innerHTML='';Q[n][1].forEach((v,i)=>{let b=document.createElement('button');b.className='ans';b.textContent=['ก. ','ข. ','ค. ','ง. '][i]+v;b.onclick=()=>answer(i,b);a.appendChild(b)});$('#feed').className='feedback';$('#feed').textContent='เลือกคำตอบก่อนเวลาหมด'}
function answer(i,b){if(lock)return;lock=true;if(i===Q[n][2]){b.classList.add('good');correct++;score+=100+t*2;setWater(water-6);state('correct');$('#speech').textContent='เยี่ยมครับ! น้ำลดลงแล้ว!';$('#feed').className='feedback good';$('#feed').textContent='✓ ถูกต้อง!'}else{b.classList.add('bad');setWater(water+9);state('wrong');$('#speech').textContent='โอ๊ะ! น้ำสูงขึ้น ข้อต่อไปเอาใหม่ครับ!';$('#feed').className='feedback bad';$('#feed').textContent='ผิด — คำตอบ '+Q[n][1][Q[n][2]]}$('#score').textContent=score;$('#prog').style.width=correct*10+'%';setTimeout(()=>{n++;render()},1000)}
function tick(){if(!$('#menu').classList.contains('hidden')||!$('#end').classList.contains('hidden')||lock)return;t--;$('#time').textContent=t;if(t<=0){lock=true;setWater(water+9);state('wrong');$('#feed').className='feedback bad';$('#feed').textContent='หมดเวลา! น้ำสูงขึ้น';setTimeout(()=>{n++;render()},900)}}
function start(){n=score=correct=0;setWater(18);$('#score').textContent=0;$('#prog').style.width=0;$('#menu').classList.add('hidden');$('#end').classList.add('hidden');render();clearInterval(timer);timer=setInterval(tick,1000)}
function finish(){clearInterval(timer);setWater(11);$('#summary').textContent=`ตอบถูก ${correct}/10 ข้อ · ${score} คะแนน`;$('#end').classList.remove('hidden')}
$('#start').onclick=start;$('#again').onclick=start;
</script></main></body></html>
